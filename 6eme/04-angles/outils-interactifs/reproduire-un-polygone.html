<div class="wrap">
  <header>
    <div><span class="tag">6e · Angles et constructions</span><h1 id="titre">Reproduire un quadrilatère</h1></div>
    <div class="bar">
      <label for="mode">Longueurs
        <select id="mode">
          <option value="entier">entières, entre 4 et 8 cm</option>

      <label for="cotes">Figure
        <select id="cotes">
          <option value="4">quadrilatère (4 côtés)</option>

      <label for="semi" class="chk"><input type="checkbox" id="semi"> demi-cercles sur les côtés</label>

  <nav role="tablist" id="tabs">

  </nav>

  <!-- Vue 1 : énoncé -->
  <section class="stage" id="v-enonce">
    <div class="consigne" id="consigne"></div>
    <svg id="fig" viewBox="0 0 900 470" role="img" aria-label="Figure codée à reproduire"></svg>
  </section>

  <!-- Vue 2 : animation -->
  <section id="v-anim" hidden>
    <div class="stage split">
      <div>
        <div class="caption" aria-live="polite"><span class="n" id="num"></span><span class="t" id="cap"></span></div>
        <svg id="svg" viewBox="0 0 860 480" role="img" aria-label="Animation de la construction"></svg>
      </div>

    </div>

    </div>

<script>
(function(){
const $=s=>document.querySelector(s);
const fr=x=>(Math.round(x*10)/10).toString().replace('.',',');
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const clamp=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
const pol=(c,r,a)=>[c[0]+r*Math.cos(rad(a)),c[1]+r*Math.sin(rad(a))];
const lerp=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
const dist=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
const rnd=(a,b,s)=>a+s*Math.floor(Math.random()*((b-a)/s+1));
const NAMES=[['A','B','C','D'],['E','F','G','H'],['M','N','O','P'],['R','S','T','U'],['K','L','M','N'],['I','J','K','L']];

/* ===================== Génération de la figure =====================
   Polygone V0 V1 … V(k-1) (sens direct), k = 4 (quadrilatère) ou 5 (pentagone).
   Données : V0V1, angle en V0 + V0V(k-1), angle en V1 + V1V2, (pentagone : angle en V2 + V2V3).
   Le dernier côté V(k-2)V(k-1) ferme la figure ; les angles en V(k-2) et V(k-1) sont à mesurer.
   Option : demi-cercles de diamètre chaque côté, à l'extérieur. */
let F=null;
const angAt=(v,p,q)=>{const a1=Math.atan2(p[1]-v[1],p[0]-v[0]),a2=Math.atan2(q[1]-v[1],q[0]-v[0]);let d=Math.abs(deg(a2-a1));return d>180?360-d:d};
const NAMES5=[['A','B','C','D','E'],['M','N','O','P','Q'],['R','S','T','U','V'],['F','G','H','K','L']];
const crs=(o,p,q)=>(p[0]-o[0])*(q[1]-o[1])-(p[1]-o[1])*(q[0]-o[0]);
const dirOf=(v,p)=>deg(Math.atan2(p[1]-v[1],p[0]-v[0]));
function generate(){
  const st=$('#mode').value==='demi'?.5:1, k=+$('#cotes').value, semi=$('#semi').checked;
  const amin=k===4?50:80, amax=k===4?130:145;
  for(let it=0;it<40000;it++){
    const L=[rnd(4,8,st),rnd(4,8,st),rnd(4,8,st)];if(k===5)L.push(rnd(4,8,st));
    if(new Set(L).size<2)continue;
    const ang=[rnd(amin,amax,5),rnd(amin,amax,5)];if(k===5)ang.push(rnd(amin,amax,5));
    const V=[[0,0],[L[0],0]];const d=[180-ang[1]];
    V.push(pol(V[1],L[2],d[0]));
    if(k===5){d.push(d[0]+180-ang[2]);V.push(pol(V[2],L[3],d[1]))}
    V.push(pol(V[0],L[1],ang[0]));
    const last=dist(V[k-2],V[k-1]);if(last<3)continue;
    let convex=true;for(let i=0;i<k;i++)if(crs(V[i],V[(i+1)%k],V[(i+2)%k])<=0.3)convex=false;
    if(!convex)continue;
    const gL=angAt(V[k-1],V[0],V[k-2]),gP=angAt(V[k-2],V[k-3],V[k-1]);// angles à mesurer
    const lo=k===4?45:70,hi=k===4?140:160;
    if(gL<lo||gL>hi||gP<lo||gP>hi)continue;
    if(Math.abs(gL-90)<6||Math.abs(gP-90)<6)continue; // pas d'angle droit « trompeur »
    if(it<30000&&(Math.abs(gL-Math.round(gL))>.25||Math.abs(gP-Math.round(gP))>.25))continue; // proches d'un entier
    // encombrement (avec les demi-cercles si l'option est cochée) : doit tenir sur une feuille A4
    const ext=[...V];if(semi)for(let i=0;i<k;i++){const a=V[i],b=V[(i+1)%k],m=lerp(a,b,.5),r=dist(a,b)/2,e=dirOf(a,b);for(let t=-180;t<=0;t+=15)ext.push(pol(m,r,e+t))}
    const xs=ext.map(p=>p[0]),ys=ext.map(p=>p[1]);
    if(Math.max(...xs)-Math.min(...xs)>(semi?17:15)||Math.max(...ys)-Math.min(...ys)>(semi?14:10.5))continue;
    if(F&&F.ang[0]===ang[0]&&F.ang[1]===ang[1]&&F.L[0]===L[0])continue;
    const pool=k===4?NAMES:NAMES5;
    F={k,semi,L,ang,d,V,last,gL,gP,n:pool[Math.floor(Math.random()*pool.length)],rot:rnd(-35,35,5),mirror:Math.random()<.5};
    return}
}
const nomFig=()=>F.k===4?'quadrilatère':'pentagone';
const ctr=V=>[V.reduce((s,p)=>s+p[0],0)/V.length,V.reduce((s,p)=>s+p[1],0)/V.length];

/* ===================== Énoncé : figure codée ===================== */
const ah=s=>`<span class="ang">${s}</span>`;
function enonce(){
  const W=900,H=470,svg=$('#fig');const {V,n,k}=F;
  const th=rad(F.rot),sg=F.mirror?-1:1;
  const T=p=>{const x=p[0]*sg,y=p[1];return [x*Math.cos(th)-y*Math.sin(th),x*Math.sin(th)+y*Math.cos(th)]};
  const ext=[...V];if(F.semi)for(let i=0;i<k;i++){const a=V[i],b=V[(i+1)%k],m=lerp(a,b,.5),r=dist(a,b)/2,e=dirOf(a,b);for(let t=-180;t<=0;t+=10)ext.push(pol(m,r,e+t))}
  const Qe=ext.map(T),xs=Qe.map(p=>p[0]),ys=Qe.map(p=>p[1]);
  const K=Math.min((W-200)/(Math.max(...xs)-Math.min(...xs)),(H-110)/(Math.max(...ys)-Math.min(...ys)),48);
  const cx=(Math.max(...xs)+Math.min(...xs))/2,cy=(Math.max(...ys)+Math.min(...ys))/2;
  const S=p=>[W/2+(p[0]-cx)*K,H/2-(p[1]-cy)*K];
  const q=V.map(T).map(S);const G=ctr(q);
  let s='';
  if(F.semi){// demi-cercles : en coordonnées écran ; le miroir inverse le sens
    for(let i=0;i<k;i++){const a=q[i],b=q[(i+1)%k],r=Math.hypot(b[0]-a[0],b[1]-a[1])/2;
      const sweep=F.mirror?1:0; // extérieur = à droite de V(i)→V(i+1) en sens direct
      s+=`<path d="M${a.join(' ')} A${r} ${r} 0 0 ${sweep} ${b.join(' ')} Z" fill="var(--green)" fill-opacity=".10" stroke="var(--ink)" stroke-width="2.4"/>`;
      const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];const ux=(b[0]-a[0])/(2*r),uy=(b[1]-a[1])/(2*r);
      // codage du milieu : deux petits traits
      [[.25],[.75]].forEach(([f])=>{const p=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];s+=`<line x1="${p[0]-uy*8+ux*3}" y1="${p[1]+ux*8+uy*3}" x2="${p[0]+uy*8-ux*3}" y2="${p[1]-ux*8-uy*3}" stroke="var(--ink)" stroke-width="2"/>`});
      s+=`<circle cx="${m[0]}" cy="${m[1]}" r="3" fill="var(--ink)"/>`}}
  s+=`<polygon points="${q.map(p=>p.join(',')).join(' ')}" fill="var(--blue-soft)" fill-opacity="${F.semi?.6:1}" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>`;
  q.forEach((p,i)=>{const dx=p[0]-G[0],dy=p[1]-G[1],m=Math.hypot(dx,dy);const o=F.semi?22:26;
    s+=`<text x="${p[0]+dx/m*o}" y="${p[1]+dy/m*o}" font-size="30" font-style="italic" text-anchor="middle" dominant-baseline="middle">${n[i]}</text>`});
  const ang=(p,q2)=>deg(Math.atan2(q2[1]-p[1],q2[0]-p[0]));
  function arcMark(v,p1,p2,txt,col){const r=36;let a1=ang(v,p1),a2=ang(v,p2);let da=((a2-a1)%360+360)%360;if(da>180){[a1,a2]=[a2,a1];da=360-da}
    const P1=[v[0]+r*Math.cos(rad(a1)),v[1]+r*Math.sin(rad(a1))],P2=[v[0]+r*Math.cos(rad(a1+da)),v[1]+r*Math.sin(rad(a1+da))];
    const mid=a1+da/2,tx=v[0]+(r+28)*Math.cos(rad(mid)),ty=v[1]+(r+28)*Math.sin(rad(mid));
    return `<path d="M${P1[0]} ${P1[1]} A${r} ${r} 0 0 1 ${P2[0]} ${P2[1]}" fill="none" stroke="${col}" stroke-width="3"/>
    <text x="${tx}" y="${ty}" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="middle" style="fill:${col}">${txt}</text>`}
  const cols=['var(--red)','var(--green)','var(--purple)'];
  s+=arcMark(q[0],q[1],q[k-1],F.ang[0]+'°',cols[0])+arcMark(q[1],q[0],q[2],F.ang[1]+'°',cols[1]);
  if(k===5)s+=arcMark(q[2],q[1],q[3],F.ang[2]+'°',cols[2]);
  const sa=$('#showans').checked,ca=sa?'var(--orange)':'var(--muted)';
  s+=arcMark(q[k-2],q[k-3],q[k-1],sa?Math.round(F.gP)+'°':'?',ca)+arcMark(q[k-1],q[k-2],q[0],sa?Math.round(F.gL)+'°':'?',ca);
  function lenMark(p,q2,txt){const m=[(p[0]+q2[0])/2,(p[1]+q2[1])/2];let nx=-(q2[1]-p[1]),ny=q2[0]-p[0];const l=Math.hypot(nx,ny);nx/=l;ny/=l;
    if((m[0]-G[0])*nx+(m[1]-G[1])*ny<0){nx=-nx;ny=-ny} // vers l'extérieur
    // avec demi-cercles : longueur écrite à l'intérieur du demi-cercle
    const o=F.semi?Math.max(16,Math.hypot(q2[0]-p[0],q2[1]-p[1])*.22):18+Math.abs(nx)*40+Math.abs(ny)*4;return `<text x="${m[0]+nx*o}" y="${m[1]+ny*o}" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle" style="fill:var(--blue)">${txt}</text>`}
  s+=lenMark(q[0],q[1],fr(F.L[0])+' cm')+lenMark(q[0],q[k-1],fr(F.L[1])+' cm')+lenMark(q[1],q[2],fr(F.L[2])+' cm');
  if(k===5)s+=lenMark(q[2],q[3],fr(F.L[3])+' cm');
  s+=`<text x="${W-14}" y="${H-12}" font-size="15" text-anchor="end" style="fill:var(--muted)">Figure codée, pas en vraie grandeur</text>`;
  svg.innerHTML=s;
  $('#titre').textContent='Reproduire un '+nomFig();
  $('#consigne').innerHTML=`Reproduis ce ${nomFig()} <b>${n.join('')}</b>${F.semi?' et ses demi-cercles':''} en vraie grandeur et écris son <b>programme de construction</b>.<br>Mesure ensuite les angles <b>${ah(n[0]+n[k-1]+n[k-2])}</b> et <b>${ah(n[k-3]+n[k-2]+n[k-1])}</b>.${sa?`<br><span class="ansTxt">${ah(n[0]+n[k-1]+n[k-2])} ≈ ${Math.round(F.gL)}° &nbsp;·&nbsp; ${ah(n[k-3]+n[k-2]+n[k-1])} ≈ ${Math.round(F.gP)}° <small>(on accepte ± 2°)</small></span>`:''}`;
}

/* ===================== Programme de construction ===================== */
function programme(){const {n,k,L,ang}=F;const Z=n[k-1];
  const p=[
    `Trace un segment [${n[0]}${n[1]}] de longueur ${fr(L[0])} cm.`,
    `Construis un angle de mesure ${ang[0]}°, de sommet ${n[0]}, dont un côté est [${n[0]}${n[1]}].`,
    `Place le point ${Z} à ${fr(L[1])} cm du point ${n[0]}, sur l'autre côté de cet angle.`,

}
function frame(ts){if(!playing)return;const dt=Math.min(.1,(ts-last)/1000);last=ts;const sp=+$('#speed').value;
  if(idx<steps.length){t+=dt*sp/steps[idx].dur;if(t>=1){t=0;idx++;if(idx>=steps.length){playing=false;setPlay()}}}
  render();if(playing)requestAnimationFrame(frame)}
function setPlay(){$('#play').textContent=playing?'❚❚ Pause':(idx>=steps.length?'↺ Rejouer':'▶ Lecture')}
$('#play').onclick=()=>{if(idx>=steps.length){idx=0;t=0}playing=!playing;setPlay();if(playing){last=performance.now();requestAnimationFrame(frame)}};
$('#next').onclick=()=>{playing=false;if(idx<steps.length){idx++;t=0}setPlay();render()};
$('#prev').onclick=()=>{playing=false;if(t>0)t=0;else if(idx>0)idx--;setPlay();render()};
$('#reset').onclick=()=>{playing=false;idx=0;t=0;setPlay();render()};

/* ===================== Vues ===================== */
function show(v){document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  ['enonce','anim','prog'].forEach(k=>$('#v-'+k).hidden=k!==v);if(v!=='anim'){playing=false;setPlay()}}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function newFigure(){generate();enonce();const pg=programme();
  const ms=mesures();const all=[...pg,'Mesures : '+ms.join(' ; ')];
  $('#pcSide').innerHTML=all.map(l=>`<li>${l}</li>`).join('');$('#pcBig').innerHTML=pg.map(l=>`<li>${l}</li>`).join('')+`<li style="list-style:none;margin-left:-1.5em;margin-top:8px"><b>Mesures attendues :</b> ${ms.join(' ; ')} <span style="color:var(--muted);font-size:.9em">(on accepte ± 2°)</span></li>`;
  $('#data').innerHTML='';
  buildAnim();render();show('enonce')}
$('#new').onclick=newFigure;
$('#mode').onchange=newFigure;
$('#cotes').onchange=newFigure;
$('#semi').onchange=newFigure;
$('#showans').onchange=()=>enonce();
$('#showprog').onchange=()=>{const on=$('#showprog').checked;document.body.classList.toggle('noprog',!on);if(!on&&!$('#v-prog').hidden)show('enonce')};
$('#fs').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}};
newFigure();
})();
</script>
