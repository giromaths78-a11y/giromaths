<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Constructions animées de triangles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : tableau quadrillé au centre, consigne de l'étape au-dessus, commandes dessous */
:root{
  --bg:#f6f8fb; --paper:#ffffff; --grid:#e3eaf3; --ink:#1b2433; --muted:#5b6676;
  --blue:#1f56a8; --blue-soft:#e3ecf9; --red:#c0362c; --green:#1d7a46; --pencil:#8a94a6;
  --tool:#c9d6ea; --tool-edge:#5d7395; --line:#c9d3e0;
  --f-display:"Bitter",Georgia,serif; --f-body:"Atkinson Hyperlegible",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121821; --paper:#1a2230; --grid:#243042; --ink:#e7edf5; --muted:#9aa6b8;
  --blue:#7fb0ff; --blue-soft:#1f2f4a; --red:#ff7f73; --green:#6fd39a; --pencil:#7c889c;
  --tool:#2d3c55; --tool-edge:#8fa6c9; --line:#33415a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121821; --paper:#1a2230; --grid:#243042; --ink:#e7edf5; --muted:#9aa6b8;
  --blue:#7fb0ff; --blue-soft:#1f2f4a; --red:#ff7f73; --green:#6fd39a; --pencil:#7c889c;
  --tool:#2d3c55; --tool-edge:#8fa6c9; --line:#33415a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,4vw,2.3rem);margin:0;text-wrap:balance}
.tag{font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit}
nav button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:var(--paper);font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.params{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.params label{display:flex;flex-direction:column;font-weight:700;font-size:.9rem;gap:2px}
.params .noms{display:flex;gap:6px;align-items:flex-end;padding-right:12px;border-right:1.5px solid var(--line)}
.params .noms input{width:2.6em;text-align:center;font-style:italic;font-family:inherit;font-size:1.1rem}
.params input{font:inherit;font-family:var(--f-mono);width:7.5em;padding:5px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.btn{font-weight:700;border:2px solid var(--blue);background:var(--paper);color:var(--blue);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--blue);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.stage{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}

.caption .n{font-family:var(--f-mono);color:var(--blue);white-space:nowrap}

svg{display:block;width:100%;height:auto}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* Plein écran (vidéoprojecteur) : la figure prend toute la hauteur disponible */
body.fs{overflow:hidden}
body.fs .wrap{max-width:none;height:100vh;height:100dvh;padding:8px 14px;gap:8px}
body.fs .wrap>div:first-child{display:none}
body.fs nav button{padding:4px 10px;font-size:.9rem}

body.fs .params .btn{padding:4px 10px;font-size:.9rem}

body.fs svg#svg{flex:1 1 auto;min-height:0;height:100%}
body.fs .controls{gap:8px}
body.fs .controls .btn{padding:6px 12px}
body.fs.sans-reglages nav,body.fs.sans-reglages .params{display:none}

input[type=range]{accent-color:var(--blue)}

.dot.on{background:var(--blue)}

</style>

<div class="wrap">
  <div><span class="tag">6e · S6 · Constructions de triangles</span><h1>Constructions animées</h1></div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-c="a">a) Trois longueurs</button>
    <button role="tab" data-c="b">b) Deux côtés et un angle</button>
    <button role="tab" data-c="c">c) Deux angles et un côté</button>
  </nav>
  <form class="params" id="params"></form>
  <section class="stage">
    <div class="caption" aria-live="polite"><span class="n" id="num"></span><span class="t" id="cap"></span></div>
    <svg id="svg" viewBox="0 0 760 440" role="img" aria-label="Animation de la construction"></svg>
  </section>
  <div class="controls">
    <button class="btn" id="prev">◀ Étape précédente</button>
    <button class="btn primary" id="play">▶ Lecture</button>
    <button class="btn" id="next">Étape suivante ▶</button>
    <button class="btn" id="reset">↺ Recommencer</button>
    <button class="btn" id="fs" title="Plein écran (touche F)">⛶ Plein écran</button>
    <button class="btn" id="regl" hidden>Masquer les réglages</button>
    <label for="boucle"><input type="checkbox" id="boucle"> Lecture en boucle</label>
    <label for="speed">Vitesse <input type="range" id="speed" min="0.5" max="2" step="0.25" value="1"></label>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const svg=$('#svg');const W=760,H=440;
const fr=x=>(Math.round(x*10)/10).toString().replace('.',',');
const rad=d=>d*Math.PI/180;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const clamp=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));

const presets={
 a:{fields:[[n=>n[0]+n[1],'6'],[n=>n[0]+n[2],'4'],[n=>n[1]+n[2],'5']],names:['A','B','C']},
 b:{fields:[[n=>n[0]+n[1],'4'],[n=>n[0]+n[2],'3'],[n=>`angle ${n[2]+n[0]+n[1]} (°)`,'42']],names:['S','T','R']},
 c:{fields:[[n=>n[0]+n[1],'5'],[n=>`angle ${n[1]+n[0]+n[2]} (°)`,'40'],[n=>`angle ${n[0]+n[1]+n[2]} (°)`,'50']],names:['A','B','C']},
};
let fin=0,cur='a',noms={a:['A','B','C'],b:['S','T','R'],c:['A','B','C']},steps=[],idx=0,t=0,playing=false,last=0,view=null,message='';

/* ---------- vue : cm -> px ---------- */
function makeView(pts){let xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  let minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const K=Math.min(55,(W-120)/(maxx-minx||1),(H-110)/(maxy-miny||1));
  const ox=(W-(maxx-minx)*K)/2-minx*K, oy=H-50-((H-100)-(maxy-miny)*K)/2+miny*K;
  return {K,P:p=>[ox+p[0]*K,oy-p[1]*K]}}
const P=p=>view.P(p);
const pol=(c,r,a)=>[c[0]+r*Math.cos(rad(a)),c[1]+r*Math.sin(rad(a))];
const lerp=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];

/* ---------- primitives SVG ---------- */
function line(a,b,cls='seg'){const [x1,y1]=P(a),[x2,y2]=P(b);
  const st={seg:'stroke="var(--ink)" stroke-width="2.5"',ray:'stroke="var(--ink)" stroke-width="1.6"',fin:'stroke="var(--blue)" stroke-width="3"'}[cls];
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${st} stroke-linecap="round"/>`}
function arc(c,r,a0,a1){if(a1-a0<0.01)return '';const [x0,y0]=P(pol(c,r,a0)),[x1,y1]=P(pol(c,r,a1));const R=r*view.K;
  return `<path d="M${x0} ${y0} A${R} ${R} 0 ${a1-a0>180?1:0} 0 ${x1} ${y1}" fill="none" stroke="var(--pencil)" stroke-width="1.8"/>`}
function cross(p){const [x,y]=P(p);return `<path d="M${x-6} ${y-6}L${x+6} ${y+6}M${x-6} ${y+6}L${x+6} ${y-6}" stroke="var(--ink)" stroke-width="2"/>`}
function label(p,s,dx,dy){const [x,y]=P(p);return `<text x="${x+dx}" y="${y+dy}" font-size="22" font-style="italic">${s}</text>`}
function len(a,b,s,side=1){const m=lerp(a,b,.5);const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);const n=[-Math.sin(ang)*side,Math.cos(ang)*side];
  const [x,y]=P([m[0]+n[0]*.45,m[1]+n[1]*.45]);return `<text x="${x}" y="${y}" font-size="15" fill="var(--blue)" style="fill:var(--blue)" text-anchor="middle" dominant-baseline="middle">${s}</text>`}
function angMark(v,a0,a1,s,col){const r=.7;let p='';const [x0,y0]=P(pol(v,r,a0)),[x1,y1]=P(pol(v,r,a1));const R=r*view.K;
  const lo=Math.min(a0,a1),hi=Math.max(a0,a1);const [s0x,s0y]=P(pol(v,r,lo)),[s1x,s1y]=P(pol(v,r,hi));
  p+=`<path d="M${s0x} ${s0y} A${R} ${R} 0 0 0 ${s1x} ${s1y}" fill="none" stroke="${col}" stroke-width="2.2"/>`;
  const [tx,ty]=P(pol(v,1.25,(lo+hi)/2));p+=`<text x="${tx}" y="${ty}" font-size="14" text-anchor="middle" dominant-baseline="middle" style="fill:${col}">${s}</text>`;return p}
/* règle posée le long de [a,b], crayon en c */
function ruler(a,b,pen,op=1){const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);const L=Math.hypot(b[0]-a[0],b[1]-a[1]);
  const s=pol([0,0],1,0);const start=lerp(a,b,-0.6/L*1),end=lerp(a,b,1+0.6/L);
  const n=[Math.sin(ang),-Math.cos(ang)];const w=.9;
  const q=[start,end,[end[0]+n[0]*w,end[1]+n[1]*w],[start[0]+n[0]*w,start[1]+n[1]*w]].map(P);
  let ticks='';const tot=L+1.2;for(let i=0;i<=Math.floor(tot*10);i++){const u=i/10-.6;const pt=lerp(a,b,u/L);const big=i%10===4;const mid=i%5===4;const h=big?.32:mid?.22:.13;
    const [x1,y1]=P(pt),[x2,y2]=P([pt[0]+n[0]*h,pt[1]+n[1]*h]);ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--tool-edge)" stroke-width="${big?1.4:.8}"/>`}
  return `<g opacity="${op}"><polygon points="${q.map(p=>p.join(',')).join(' ')}" fill="var(--tool)" fill-opacity=".75" stroke="var(--tool-edge)" stroke-width="1.2"/>${ticks}</g>`+(pen?pencil(pen,op):'')}
function pencil(p,op=1){const [x,y]=P(p);return `<g opacity="${op}"><path d="M${x} ${y} l10 -26 l8 3 z" fill="#e0a42b" stroke="var(--tool-edge)" stroke-width="1"/><path d="M${x} ${y} l3.5 -9 l3 1.2 z" fill="var(--ink)"/></g>`}
/* compas : pointe en c, mine en m */
function compass(c,m,op=1){const [x1,y1]=P(c),[x2,y2]=P(m);const mx=(x1+x2)/2,my=(y1+y2)/2;const d=Math.hypot(x2-x1,y2-y1);
  const h=Math.max(70,d*.9);let nx=-(y2-y1)/(d||1),ny=(x2-x1)/(d||1);if(ny>0){nx=-nx;ny=-ny}
  const hx=mx+nx*h,hy=my+ny*h;
  return `<g opacity="${op}"><line x1="${hx}" y1="${hy}" x2="${x1}" y2="${y1}" stroke="var(--tool-edge)" stroke-width="5" stroke-linecap="round"/>
  <line x1="${hx}" y1="${hy}" x2="${x2}" y2="${y2}" stroke="var(--tool-edge)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="${x2}" cy="${y2}" r="3" fill="var(--ink)"/><circle cx="${hx}" cy="${hy}" r="7" fill="var(--tool)" stroke="var(--tool-edge)" stroke-width="2"/>
  <line x1="${hx}" y1="${hy}" x2="${hx+nx*16}" y2="${hy+ny*16}" stroke="var(--tool-edge)" stroke-width="4" stroke-linecap="round"/></g>`}
/* rapporteur centré en v, base dans la direction dir (degrés), ouvert du côté sgn */
function protractor(v,dir,sgn,op=1){const R=2.6;let g='';const pts=[];
  for(let a=0;a<=180;a+=3)pts.push(P(pol(v,R,dir+sgn*a)));
  g+=`<path d="M${pts.map(p=>p.join(' ')).join(' L')} Z" fill="var(--tool)" fill-opacity=".7" stroke="var(--tool-edge)" stroke-width="1.2"/>`;
  for(let a=0;a<=180;a+=5){const big=a%10===0;const [x1,y1]=P(pol(v,R,dir+sgn*a)),[x2,y2]=P(pol(v,R*(big?.86:.92),dir+sgn*a));g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--tool-edge)" stroke-width="${big?1.2:.7}"/>`;
    if(a%30===0&&a>0&&a<180){const [tx,ty]=P(pol(v,R*.74,dir+sgn*a));g+=`<text x="${tx}" y="${ty}" font-size="10" text-anchor="middle" dominant-baseline="middle" style="fill:var(--tool-edge)">${a}</text>`}}
  const inner=[];for(let a=0;a<=180;a+=10)inner.push(P(pol(v,.5,dir+sgn*a)));g+=`<path d="M${inner.map(p=>p.join(' ')).join(' L')}" fill="none" stroke="var(--tool-edge)" stroke-width="1"/>`;
  const [cx,cy]=P(v);const [ux,uy]=P(pol(v,.5,dir+sgn*90));g+=`<line x1="${cx}" y1="${cy}" x2="${ux}" y2="${uy}" stroke="var(--tool-edge)" stroke-width="1"/>`;
  return `<g opacity="${op}">${g}</g>`}
function dot(p,col='var(--red)'){const [x,y]=P(p);return `<circle cx="${x}" cy="${y}" r="4.5" fill="${col}"/>`}

/* ---------- étapes ---------- */
// chaque étape : {cap, dur, draw(u)} ; draw renvoie le SVG de l'état à l'avancement u (0..1)
function segStep(cap,a,b,lab,na,nb,showPts=true){return {cap,dur:2.2,draw:u=>{const k=ease(clamp(u,.15,.85));const e=lerp(a,b,k);let s='';
  if(k>0)s+=line(a,e);if(showPts){s+=cross(a)+label(a,na,-28,8);if(k>=1){s+=cross(b)+label(b,nb,12,8)}}if(k>=1&&lab)s+=len(a,b,lab,-1);
  const op=u<.15?u/.15:u>.85?(1-u)/.15:1;if(u<1)s+=ruler(a,b,e,op);return s}}}
function arcStep(cap,c,r,a0,a1){return {cap,dur:2.6,draw:u=>{const k=ease(clamp(u,.15,.85));const a=a0+(a1-a0)*k;let s=arc(c,r,a0,a);
  const op=u<.15?u/.15:u>.85?(1-u)/.15:1;if(u<1)s+=compass(c,pol(c,r,u<.15?a0:a),op);return s}}}
function protStep(cap,v,dir,sgn,ang,col){return {cap,dur:2.6,draw:u=>{let s='';const op=u<.2?u/.2:u>.85?(1-u)/.15:1;
  if(u<1)s+=protractor(v,dir,sgn,op);if(u>.45){const m=pol(v,2.75,dir+sgn*ang);s+=dot(m,col);if(u<1)s+=pencil(m,op)}return s}}}
function rayStep(cap,v,dir,len){return {cap,dur:1.8,draw:u=>{const k=ease(clamp(u,.15,.85));const end=pol(v,len,dir);const e=lerp(v,end,k);let s='';if(k>0)s+=line(v,e,'ray');
  const op=u<.15?u/.15:u>.85?(1-u)/.15:1;if(u<1)s+=ruler(v,end,e,op);return s}}}
function pointStep(cap,p,n,dx,dy){return {cap,dur:1.2,draw:u=>{let s='';if(u>.2){const [x,y]=P(p);const r=u<.6?20*(1-(u-.2)/.4)+6:0;if(r)s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="var(--red)" stroke-width="2"/>`;s+=cross(p)+label(p,n,dx,dy)}return s}}}
function finStep(cap,segs){return {cap,dur:2,draw:u=>{let s='';segs.forEach((g,i)=>{const k=ease(clamp(u,i/segs.length,(i+1)/segs.length));if(k>0)s+=line(g[0],lerp(g[0],g[1],k),'fin');if(k>=1&&g[2])s+=len(g[0],g[1],g[2],g[3]||1)});return s}}}

function build(){
  const vals=[...document.querySelectorAll('#params input.v')].map(i=>parseFloat(i.value.replace(',','.')));
  message='';steps=[];idx=0;t=0;
  const lus=[...document.querySelectorAll('#params input.nm')].map(i=>i.value.trim().toUpperCase());
  if(lus.some(x=>!/^[A-Z]$/.test(x))){message='Chaque point se nomme avec une lettre majuscule.';render();return}
  if(new Set(lus).size<3){message='Les trois points doivent avoir des noms différents.';render();return}
  noms[cur]=lus;const [N0,N1,N2]=lus;
  if(vals.some(v=>!(v>0))){message='Entre des nombres positifs.';render();return}
  if(cur==='a'){const [c,b,a]=vals;// AB=c, AC=b, BC=a
    const A=[0,0],B=[c,0];const x=(c*c+b*b-a*a)/(2*c),y2=b*b-x*x;
    const so=[a,b,c].sort((p,q)=>p-q);const eg=Math.abs(so[0]+so[1]-so[2])<1e-9;  // cas d'égalité : triangle aplati
    const ok=!eg&&y2>1e-9;const C=ok?[x,Math.sqrt(y2)]:eg?[x,0]:null;
    const tA=ok?Math.atan2(C[1],C[0])*180/Math.PI:60, tB=ok?Math.atan2(C[1],C[0]-c)*180/Math.PI:120;
    if(eg){const e=Math.max(a,b)*0.5+0.8;view=makeView([A,B,C,[Math.min(0,x)-1,e],[Math.max(c,x)+1,-e]]);}
    else view=makeView([A,B,[0,b],[c,a],[-b*.3,0],[c+a*.3,0],ok?C:[c/2,0]].concat(ok?[]:[[c/2,Math.max(a,b)]]));
    steps.push({cap:'On fait d\'abord une figure à main levée codée, puis on vérifie : '+(ok?`${fr(Math.min(a,b))} + ${fr(Math.max(a,b))}`:'')+'…',dur:1.5,draw:()=>''});
    const s=[a,b,c].sort((p,q)=>p-q);steps[0].cap=`Vérification : le plus grand côté mesure ${fr(s[2])} cm et ${fr(s[0])} + ${fr(s[1])} = ${fr(s[0]+s[1])}`+(eg?` : la somme est égale au plus grand côté. Les points seront alignés.`:s[0]+s[1]>s[2]?` > ${fr(s[2])}. On peut construire le triangle.`:false?` = ${fr(s[2])}. Les points seront alignés.`:` < ${fr(s[2])}. Regardons ce qui se passe…`);
    steps.push(segStep(`Tracer le segment [${N0}${N1}] de longueur ${fr(c)} cm.`,A,B,fr(c)+' cm',N0,N1));
    if(ok){steps.push(arcStep(`Tracer un arc de cercle de centre ${N0} et de rayon ${fr(b)} cm.`,A,b,tA-14,tA+14));
      steps.push(arcStep(`Tracer un arc de cercle de centre ${N1} et de rayon ${fr(a)} cm.`,B,a,tB-14,tB+14));
      steps.push(pointStep(`Les deux arcs se coupent : on nomme ${N2} ce point.`,C,N2,-6,-14));
      steps.push(finStep(`Tracer [${N0}${N2}] et [${N1}${N2}] : le triangle ${N0+N1+N2} est construit.`,[[A,C,fr(b)+' cm',1],[B,C,fr(a)+' cm',-1]]));}
    else if(eg){// le point d'intersection est sur la droite (AB)
      const dA=x>0?0:180,dB=x>c?0:180;
      steps.push(arcStep(`Tracer un arc de cercle de centre ${N0} et de rayon ${fr(b)} cm.`,A,b,dA-28,dA+28));
      steps.push(arcStep(`Tracer un arc de cercle de centre ${N1} et de rayon ${fr(a)} cm.`,B,a,dB-28,dB+28));
      steps.push(pointStep(`Les deux arcs se touchent en un seul point, situé sur la droite (${N0}${N1}) : on nomme ${N2} ce point.`,C,N2,-6,-14));
      // quel point est entre les deux autres ? (celui qui n'est pas une extrémité du plus grand côté)
      const P={[N0]:A,[N1]:B,[N2]:C};let X,Y,Z;
      if(so[2]===c){X=N2;Y=N0;Z=N1}else if(so[2]===b){X=N1;Y=N0;Z=N2}else{X=N0;Y=N1;Z=N2}
      steps.push({cap:`Conclusion : le point ${X} appartient au segment [${Y}${Z}]. Les points ${N0}, ${N1} et ${N2} sont alignés : on obtient un « triangle aplati ».`,dur:2.4,draw:u=>{
        const k=ease(clamp(u,.1,.6));let g='';if(k>0)g+=line(P[Y],lerp(P[Y],P[Z],k),'fin');
        if(u>.6){const [px,py]=view.P(P[X]);const op=Math.min(1,(u-.6)/.2);
          g+=`<g opacity="${op}"><circle cx="${px}" cy="${py}" r="11" fill="none" stroke="var(--red)" stroke-width="3"/>`+
             `<text x="${px}" y="${py+80}" text-anchor="middle" font-size="24" font-weight="700" style="fill:var(--red);paint-order:stroke;stroke:var(--paper,#fff);stroke-width:5px">${X} ∈ [${Y}${Z}]</text></g>`;}
        return g}});}
    else{steps.push(arcStep(`Tracer un arc de cercle de centre ${N0} et de rayon ${fr(b)} cm.`,A,b,0,120));
      steps.push(arcStep(`Tracer un arc de cercle de centre ${N1} et de rayon ${fr(a)} cm.`,B,a,60,180));
      steps.push({cap:`Les deux arcs ne se coupent pas : on ne peut pas placer ${N2}. Ce triangle n'existe pas.`,dur:1.5,draw:()=>''});}
  }
  if(cur==='b'){const [st,sr,ang]=vals;if(ang>=180){message='L\'angle doit être inférieur à 180°.';render();return}
    const S=[0,0],T=[st,0],R=pol(S,sr,ang);const rl=Math.max(sr+1,3.2);
    view=makeView([S,T,R,pol(S,rl,ang),[-2.7,0],[2.7,0],[0,2.7],[st+.6,0]]);
    steps.push(segStep(`Tracer le segment [${N0}${N1}] de longueur ${fr(st)} cm.`,S,T,fr(st)+' cm',N0,N1));
    steps.push(protStep(`Placer le centre du rapporteur en ${N0}, le zéro sur [${N0}${N1}], et marquer ${fr(ang)}°.`,S,0,1,ang,'var(--red)'));
    steps.push(rayStep(`Tracer la demi-droite d'origine ${N0} qui passe par le repère.`,S,ang,rl));
    steps.push({cap:`Sur cette demi-droite, placer ${N2} à ${fr(sr)} cm de ${N0}.`,dur:2.2,draw:u=>{let s=angMark(S,0,ang,fr(ang)+'°','var(--red)');const op=u<.15?u/.15:u>.85?(1-u)/.15:1;
      if(u<1)s+=ruler(S,pol(S,rl,ang),u>.5?R:null,op);if(u>.5)s+=cross(R)+label(R,N2,-24,-6);return s}});
    steps.push(finStep(`Tracer le segment [${N2}${N1}] : le triangle ${N2+N0+N1} est construit.`,[[S,R,fr(sr)+' cm',1],[R,T,'',1]]));
  }
  if(cur==='c'){const [ab,a1,a2]=vals;const A=[0,0],B=[ab,0];
    const ok=a1+a2<180;let C=null;
    if(ok){const ta=Math.tan(rad(a1)),tb=Math.tan(rad(a2));const x=ab*tb/(ta+tb);C=[x,x*ta];}
    const rl=ok?Math.hypot(C[0],C[1])+1.2:4;const rl2=ok?Math.hypot(C[0]-ab,C[1])+1.2:4;
    view=makeView([A,B,[-2.7,0],[ab+2.7,0],[0,2.7],[ab,2.7],ok?pol(A,rl,a1):pol(A,4,a1),ok?pol(B,rl2,180-a2):pol(B,4,180-a2)]);
    steps.push(segStep(`Tracer le segment [${N0}${N1}] de longueur ${fr(ab)} cm.`,A,B,fr(ab)+' cm',N0,N1));
    steps.push(protStep(`Rapporteur centré en ${N0}, zéro sur [${N0}${N1}] : marquer ${fr(a1)}°.`,A,0,1,a1,'var(--blue)'));
    steps.push(rayStep(`Tracer la demi-droite d'origine ${N0} qui passe par le repère.`,A,a1,rl));
    steps.push(protStep(`Rapporteur centré en ${N1}, zéro sur [${N1}${N0}] : marquer ${fr(a2)}°.`,B,180,-1,a2,'var(--red)'));
    steps.push(rayStep(`Tracer la demi-droite d'origine ${N1} qui passe par le repère.`,B,180-a2,rl2));
    if(ok){steps.push(pointStep(`Les deux demi-droites se coupent : on nomme ${N2} ce point.`,C,N2,-6,-14));
      steps.push(finStep(`Repasser [${N0}${N2}] et [${N1}${N2}] : le triangle ${N0+N1+N2} est construit.`,[[A,C,'',1],[B,C,'',1]]));}
    else steps.push({cap:`${fr(a1)}° + ${fr(a2)}° ≥ 180° : les demi-droites ne se coupent pas, le triangle n'existe pas.`,dur:1.5,draw:()=>''});
  }
  // marques d'angle persistantes après les rayons
  render();
}

/* ---------- rendu ---------- */
function persistent(i){// éléments ajoutés une fois l'étape i terminée
  if(cur==='b'&&i>=2){const v=vals();return angMark([0,0],0,v[2],fr(v[2])+'°','var(--red)')}
  if(cur==='c'){const v=vals();let s='';if(i>=2)s+=angMark([0,0],0,v[1],fr(v[1])+'°','var(--blue)');if(i>=4)s+=angMark([v[0],0],180-v[2],180,fr(v[2])+'°','var(--red)');return s}
  return ''}
function vals(){return [...document.querySelectorAll('#params input.v')].map(i=>parseFloat(i.value.replace(',','.')))}
function grid(){if(!view)return '';let g='';const K=view.K;const [ox,oy]=view.P([0,0]);
  for(let x=ox%K;x<W;x+=K)g+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--grid)" stroke-width="1"/>`;
  for(let y=oy%K;y<H;y+=K)g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;return g}
function render(){
  if(message){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="20" style="fill:var(--red)">${message}</text>`;$('#cap').textContent='';$('#num').textContent='';$('#dots').innerHTML='';return}
  let s=grid();
  for(let i=0;i<idx;i++){s+=steps[i].draw(1);s+=''}
  let pers='';for(let i=0;i<idx;i++)pers=persistent(i);
  s+=pers;
  if(idx<steps.length)s+=steps[idx].draw(t);
  svg.innerHTML=s;
  const shown=Math.min(idx,steps.length-1);
  $('#num').textContent=`Étape ${shown+1} / ${steps.length}`;$('#cap').textContent=steps[shown].cap;
  $('#dots').innerHTML=steps.map((_,i)=>`<span class="dot ${i<=shown?'on':''}"></span>`).join('');
  $('#prev').disabled=idx===0&&t===0;$('#next').disabled=idx>=steps.length;
}
function frame(ts){if(!playing)return;const dt=(ts-last)/1000;last=ts;const sp=+$('#speed').value;
  if(idx<steps.length){t+=dt*sp/steps[idx].dur;if(t>=1){t=0;idx++;if(idx>=steps.length){if($('#boucle').checked&&!message){fin=0}else{playing=false;setPlay()}}}}
  else if($('#boucle').checked&&steps.length){fin+=dt*sp;if(fin>=2.5){idx=0;t=0}}  /* boucle : la figure finie reste 2,5 s, puis on recommence */
  else{playing=false;setPlay()}
  render();if(playing)requestAnimationFrame(frame)}
function setPlay(){$('#play').textContent=playing?'❚❚ Pause':(idx>=steps.length?'↺ Rejouer':'▶ Lecture')}
$('#play').onclick=()=>{if(idx>=steps.length){idx=0;t=0}playing=!playing;setPlay();if(playing){last=performance.now();requestAnimationFrame(frame)}};
$('#next').onclick=()=>{playing=false;if(idx<steps.length){idx++;t=0}setPlay();render()};
$('#prev').onclick=()=>{playing=false;if(t>0)t=0;else if(idx>0)idx--;setPlay();render()};
$('#reset').onclick=()=>{playing=false;idx=0;t=0;setPlay();render()};

function setCase(c){cur=c;playing=false;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.c===c));
  const f=$('#params');const n=noms[c];
  f.innerHTML=`<div class="noms"><label for="n0">Noms des points<span style="display:flex;gap:6px">${n.map((x,i)=>`<input class="nm" id="n${i}" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${x}" aria-label="Nom du point ${i+1}">`).join('')}</span></label></div>`+
    presets[c].fields.map(([l,v],i)=>`<label for="f${i}"><span class="lb" data-i="${i}"></span><input class="v" id="f${i}" inputmode="decimal" value="${v}"></label>`).join('')+`<button class="btn" type="submit">Appliquer</button><button class="btn" type="button" id="def">Exemple du cours</button>`+(c==='a'?`<button class="btn" type="button" id="plat">Exemple : triangle aplati</button>`:'');
  libelles();f.querySelectorAll('input.nm').forEach(i=>i.addEventListener('input',()=>{i.value=i.value.toUpperCase();libelles()}));
  $('#def').onclick=()=>{noms[c]=presets[c].names.slice();setCase(c)};
  if(c==='a')$('#plat').onclick=()=>{const v=['7','3','4'];document.querySelectorAll('#params input.v').forEach((i,k)=>i.value=v[k]);playing=false;build();setPlay()};build();setPlay()}
function libelles(){const n=[...document.querySelectorAll('#params input.nm')].map(i=>i.value.trim().toUpperCase()||'?');
  document.querySelectorAll('#params .lb').forEach(sp=>{const l=presets[cur].fields[+sp.dataset.i][0](n);sp.textContent=l+(l.includes('°')?'':' (cm)')})}
$('#params').addEventListener('submit',e=>{e.preventDefault();playing=false;build();setPlay()});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.c;setCase(b.dataset.c)});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(presets[h]&&h!==cur)setCase(h)});
setCase(presets[location.hash.slice(1)]?location.hash.slice(1):'a');
/* ---------- plein écran ---------- */
const docEl=document.documentElement;
const fsApi=!!(docEl.requestFullscreen||docEl.webkitRequestFullscreen);
const enFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function majFs(on){document.body.classList.toggle('fs',on);if(!on)document.body.classList.remove('sans-reglages');
  $('#fs').textContent=on?'✕ Quitter le plein écran':'⛶ Plein écran';$('#regl').hidden=!on;$('#regl').textContent='Masquer les réglages'}
function basculerFs(){const on=document.body.classList.contains('fs');
  if(fsApi){if(!on){(docEl.requestFullscreen||docEl.webkitRequestFullscreen).call(docEl);majFs(true)}else{if(enFs())(document.exitFullscreen||document.webkitExitFullscreen).call(document);majFs(false)}}
  else majFs(!on)}  // iPhone : pas d'API plein écran, on agrandit dans la fenêtre
$('#fs').onclick=basculerFs;
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!enFs())majFs(false)}));
$('#regl').onclick=()=>{const c=document.body.classList.toggle('sans-reglages');$('#regl').textContent=c?'Afficher les réglages':'Masquer les réglages'};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='f'||e.key==='F'){e.preventDefault();basculerFs()}
  else if(e.key===' '){e.preventDefault();$('#play').click()}
  else if(e.key==='ArrowRight')$('#next').click();else if(e.key==='ArrowLeft')$('#prev').click();
  else if(e.key==='Escape'&&document.body.classList.contains('fs')&&!enFs())majFs(false)});
// état initial lisible : afficher la figure terminée en aperçu ? on montre l'étape 1 prête.
})();
</script>

</body></html>
