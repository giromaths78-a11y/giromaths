<style>
/* Layout : même cahier à petits carreaux que « La machine à fonctions » ; un exercice à la fois,
   pastilles d'avancement en haut. Vert = antécédent, rouge = image, bleu = fonction. */
:root{
  --paper:#f7f9fc; --grid:#dfe7f2; --ink:#18202e; --muted:#5b6678; --card:#ffffff; --line:#c9d3e1;
  --ant:#1b8a3a; --ant-soft:#e3f4e7; --img:#cf2f2b; --img-soft:#fbe6e4; --fn:#1f4e9c; --fn-soft:#e6edf8;

  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-math:"Crimson Pro", "Cambria Math", Georgia, serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121722; --grid:#1d2533; --ink:#e8edf5; --muted:#9aa6b8; --card:#1a2130; --line:#2f3a4d;
  --ant:#4cc372; --ant-soft:#173324; --img:#ff6b63; --img-soft:#3a1d1d; --fn:#7aa5ff; --fn-soft:#1b2a47;
  --warn:#ffb547; --warn-soft:#3a2a12; --focus:#ffc94d; --on-fn:#0d1526; --blue-curve:#6ea0ff; --red-curve:#ff6b63; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121722; --grid:#1d2533; --ink:#e8edf5; --muted:#9aa6b8; --card:#1a2130; --line:#2f3a4d;
  --ant:#4cc372; --ant-soft:#173324; --img:#ff6b63; --img-soft:#3a1d1d; --fn:#7aa5ff; --fn-soft:#1b2a47;
  --warn:#ffb547; --warn-soft:#3a2a12; --focus:#ffc94d; --on-fn:#0d1526; --blue-curve:#6ea0ff; --red-curve:#ff6b63; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font:17px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg,var(--grid) 1px, transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:1040px; margin:0 auto; padding-block:18px 28px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:14px}
header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:10px 20px}
h1{font:800 clamp(26px,4vw,38px)/1.05 var(--f-display); margin:0; letter-spacing:-.01em}
.sub{color:var(--muted); font-size:15px}
.prog{font:700 15px var(--f-body); color:var(--muted); font-variant-numeric:tabular-nums}
.prog b{color:var(--ant); font-size:20px}
nav.exs{display:flex; flex-wrap:wrap; gap:6px}
nav.exs button{font:700 15px var(--f-body); width:42px; height:42px; border-radius:50%; border:2px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; font-variant-numeric:tabular-nums}
nav.exs button.done{border-color:var(--ant); background:var(--ant-soft); color:var(--ant)}
nav.exs button.part{border-color:var(--warn); background:var(--warn-soft); color:var(--warn)}
nav.exs button[aria-current="step"]{outline:3px solid var(--fn); outline-offset:2px}
button:focus-visible, input:focus-visible, select:focus-visible{outline:3px solid var(--focus); outline-offset:2px}

.stage{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:22px clamp(16px,3vw,30px);
  display:flex; flex-direction:column; gap:16px; box-shadow:0 10px 30px -18px rgba(20,40,80,.35)}
.stage h2{font:800 clamp(22px,3vw,28px)/1.15 var(--f-display); margin:0}
.stage h2 small{display:block; font:700 13px var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
.stage p{margin:0}
.q{display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px dashed var(--line)}
.q > .lbl{font-weight:700}
.cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start}

.panel{display:flex; flex-direction:column; gap:12px; min-width:0}
.m{font-family:var(--f-math); font-style:italic; font-size:1.17em}
.ant{color:var(--ant); font-weight:700}
.img{color:var(--img); font-weight:700}
.line{display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px}

input.num{font:600 17px var(--f-body); width:5.2em; padding:5px 8px; border:2px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); text-align:center; font-variant-numeric:tabular-nums}
input.num.wide{width:9em}
input.num.ok, .tbl input.num.ok{border-color:var(--ant); background:var(--ant-soft)}

.mcq{display:flex; flex-wrap:wrap; gap:6px}
.mcq button{font:600 16px var(--f-body); border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:9px; padding:6px 12px; cursor:pointer; text-align:left}
.mcq button .m{font-size:1.1em}
.mcq button[aria-pressed="true"]{border-color:var(--fn); background:var(--fn-soft)}
.mcq.ok button[aria-pressed="true"]{border-color:var(--ant); background:var(--ant-soft)}
.mcq.bad button[aria-pressed="true"]{border-color:var(--img); background:var(--img-soft)}
.mcq.vf button{min-width:64px; text-align:center}

.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse; font-variant-numeric:tabular-nums}
table.tbl th, table.tbl td{border:1.5px solid var(--line); padding:5px 7px; text-align:center; min-width:52px}
table.tbl th{font-family:var(--f-math); font-style:italic; font-size:18px; background:var(--ant-soft); color:var(--ant); white-space:nowrap}
table.tbl tr.ri th{background:var(--img-soft); color:var(--img)}
table.tbl tr.ri2 th{background:var(--fn-soft); color:var(--fn)}
table.tbl input.num{width:4.2em; padding:4px; font-size:16px}
table.vf td:first-child{text-align:left}

.actions{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding-top:6px}
.btn{font:700 16px var(--f-body); border:0; border-radius:10px; padding:10px 18px; cursor:pointer; background:var(--fn); color:var(--on-fn)}
.btn.ghost{background:transparent; color:var(--fn); border:1.5px solid var(--fn)}
.btn:disabled{opacity:.45; cursor:default}
.result{font-weight:700}
.result.ok{color:var(--ant)} .result.part{color:var(--warn)}
.corr{border:1.5px solid var(--fn); background:var(--fn-soft); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:6px}
.corr .t{font:800 13px var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--fn)}
.hint{color:var(--muted); font-size:14px}
svg{display:block; width:100%; height:auto; max-width:100%}
svg text{font-family:var(--f-body)}
svg.clickable{cursor:crosshair; touch-action:manipulation}
.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.chips button{font:700 16px var(--f-body); min-width:44px; border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:9px; padding:5px 10px; cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--fn); background:var(--fn-soft); color:var(--fn)}
.chips button.ok{border-color:var(--ant); color:var(--ant)}
.chips button.bad{border-color:var(--img); color:var(--img)}
footer.nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

    function draw(){
      A=axes(svg,{W:460,H:420,pad:{l:24,r:16,t:14,b:24},xmin:-5.6,xmax:5.6,ymin:-4.6,ymax:5.6,xs:1,ys:1,xlab:"x",ylab:"y"});
      const {X,Y}=A, fn=css("--fn"), img=css("--img"), ink=css("--ink");
      const P=state.pts, all=["A","B","C","D"].every(k=>P[k]);
      if(all){
        svg.appendChild(sv("polygon",{points:["A","B","C","D"].map(k=>X(P[k][0])+","+Y(P[k][1])).join(" "),fill:"none",stroke:fn,"stroke-width":2.5}));
        svg.appendChild(sv("line",{x1:X(P.A[0]),y1:Y(P.A[1]),x2:X(P.C[0]),y2:Y(P.C[1]),stroke:fn,"stroke-width":1.8,"stroke-dasharray":"6 5"}));
        svg.appendChild(sv("line",{x1:X(P.B[0]),y1:Y(P.B[1]),x2:X(P.D[0]),y2:Y(P.D[1]),stroke:fn,"stroke-width":1.8,"stroke-dasharray":"6 5"}));
      }
      for(const k in P){ const [x,y]=P[k];
        svg.appendChild(sv("circle",{cx:X(x),cy:Y(y),r:6,fill:img}));
        const t=sv("text",{x:X(x)+8,y:Y(y)-8,"font-size":17,"font-weight":700,fill:ink}); t.textContent=k; svg.appendChild(t); }
    }
    function upd(){ $$("button",sel).forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===cur)); draw(); }
    svg.addEventListener("click",e=>{ const p=svgPoint(svg,e); const x=Math.round(A.Xi(p.x)), y=Math.round(A.Yi(p.y));
      if(x<-5||x>5||y<-4||y>5) return; state.pts[cur]=[x,y];
      const nxt=["A","B","C","D"].find(k=>!state.pts[k]); if(nxt) cur=nxt;
      $$("button",sel).forEach(b=>b.classList.remove("ok","bad")); upd(); save(); });
    upd();
    return { check(){ let ok=0; $$("button",sel).forEach(b=>{ const k=b.dataset.k, p=state.pts[k]; const good=p&&p[0]===target[k][0]&&p[1]===target[k][1]; b.classList.toggle("ok",good); b.classList.toggle("bad",!good); if(good) ok++; }); return [ok,4]; }, redraw:draw };
  }},

  <div class="q"><span class="lbl">c. Poids d'Ahmed</span>
    <div class="tblwrap"><table class="tbl"><tr><th>x</th><td>0</td><td>3</td><td>6</td><td>9</td><td>12</td><td>18</td><td>24</td><td>36</td></tr>
    <tr class="ri"><th>p(x)</th><td>3,5</td><td>6</td><td>8</td><td>8,5</td><td>9</td><td>9,5</td><td>10</td><td>12</td></tr></table></div>
    <p class="hint">Clique sur le graphique pour placer les 8 points d'Ahmed (clique sur un point pour l'effacer). <span id="p12n"></span></p>
    <span class="lbl">Commenter la courbe obtenue :</span>
    ${Q(["Le poids d'Ahmed reste toujours entre les deux courbes : il est normal","Ahmed est en dessous du poids minimum dès 6 mois","Ahmed dépasse le poids maximum à 36 mois"],0)}</div>`,
  corr:`a. Lectures (à 0,5 près) : ${M("f(3) ≈ 4")}, ${M("g(3) ≈ 6,8")} ; ${M("f(12) ≈ 7,4")}, ${M("g(12) ≈ 11,8")} ; ${M("f(15) = 8")}, ${M("g(15) ≈ 12,8")} ; ${M("f(24) ≈ 9,4")}, ${M("g(24) ≈ 14,8")} ; ${M("g(30) = 16")}, ${M("f(30) ≈ 10,4")} ; ${M("f(34,5) ≈ 10,8")}, ${M("g(34,5) ≈ 16,9")}.<br>c. La courbe d'Ahmed reste entre les deux courbes ; elle se rapproche du minimum entre 18 et 24 mois, puis s'en éloigne.`,
  mount(st,state){
    const svg=$("#p12svg",st), F=[[0,2.4],[3,4],[6,5.6],[9,6.6],[12,7.4],[15,8],[18,8.4],[21,9],[24,9.4],[27,9.8],[30,10.4],[33,10.6],[36,11]],
      G=[[0,4.2],[3,6.8],[6,9.2],[9,10.6],[12,11.8],[15,12.8],[18,13.4],[21,14.2],[24,14.8],[27,15.4],[30,16],[33,16.6],[36,17.2]],
      AH=[[0,3.5],[3,6],[6,8],[9,8.5],[12,9],[18,9.5],[24,10],[36,12]];
    state.ah=state.ah||[]; let A;
    function draw(){
      A=axes(svg,{W:640,H:380,pad:{l:36,r:16,t:14,b:26},xmin:0,xmax:36,ymin:0,ymax:20,xs:3,ys:2,zero:true,noArrows:true,xlabels:x=>x===0?"N":fmt(x),xlab:"âge (mois)",ylab:"poids (kg)"});
      const {X,Y}=A, ink=css("--ink"), img=css("--img");
      svg.appendChild(sv("path",{d:smooth(G,X,Y),fill:"none",stroke:ink,"stroke-width":3}));
      svg.appendChild(sv("path",{d:smooth(F,X,Y),fill:"none",stroke:ink,"stroke-width":3}));
      const t1=sv("text",{x:X(30.5),y:Y(17.8),"font-size":14,"font-weight":700,fill:ink}); t1.textContent="g (maximum)"; svg.appendChild(t1);
      const t2=sv("text",{x:X(30.5),y:Y(8.6),"font-size":14,"font-weight":700,fill:ink}); t2.textContent="f (minimum)"; svg.appendChild(t2);
      const pts=[...state.ah].sort((a,b)=>a[0]-b[0]);
      if(pts.length>1) svg.appendChild(sv("polyline",{points:pts.map(([x,y])=>X(x)+","+Y(y)).join(" "),fill:"none",stroke:img,"stroke-width":2.5}));
      pts.forEach(([x,y])=>svg.appendChild(sv("circle",{cx:X(x),cy:Y(y),r:6,fill:img})));
      $("#p12n",st).textContent=`${state.ah.length} / 8 points placés.`;
    }
    svg.addEventListener("click",e=>{ const p=svgPoint(svg,e); const x=Math.round(A.Xi(p.x)/3)*3, y=Math.round(A.Yi(p.y)*2)/2;
      if(x<0||x>36||y<0||y>20) return;
      const k=state.ah.findIndex(q=>q[0]===x);
      if(k>=0 && state.ah[k][1]===y) state.ah.splice(k,1); else if(k>=0) state.ah[k]=[x,y]; else state.ah.push([x,y]);
      draw(); save(); });
    draw();
    return { redraw:draw, check(){ let ok=0; AH.forEach(([x,y])=>{ if(state.ah.some(q=>q[0]===x&&Math.abs(q[1]-y)<0.3)) ok++; }); const extra=state.ah.filter(q=>!AH.some(([x,y])=>q[0]===x&&Math.abs(q[1]-y)<0.3)).length; return [Math.max(0,ok-extra),8]; } };
  }},
/* ---------- 13 ---------- */
{ html:`<h2><small>Exercice 13</small>Un peu de football</h2>
  <p>${M("h(x) = −5x² + 20x")}. Lors d'un dégagement, ${M("h(t)")} est la hauteur en mètres du ballon au-dessus du sol, <i>t</i> secondes après le tir.</p>
  <div class="q"><span class="lbl">a. Hauteur du ballon</span><div class="line">
    <span>au bout d'une seconde :</span>${N(15)}<span>m</span><span>au bout de deux secondes :</span>${N(20)}<span>m</span></div></div>
  <div class="q"><div class="line"><span class="lbl">b.</span><span class="eq">h(4) = ${N(0)}</span></div>
    <span class="lbl">Interprétation :</span>${Q(["Au bout de 4 s, le ballon est retombé au sol","Le ballon monte à 4 m","Au bout de 4 s, le ballon est au plus haut"],0)}</div>
  <div class="q"><span class="lbl">c. Compléter le tableau de valeurs</span>
    <div class="tblwrap"><table class="tbl"><tr><th>x</th><td>−5</td><td>0</td><td>1</td><td>1,5</td><td>2</td><td>2,5</td><td>3</td><td>5</td></tr>
    <tr class="ri"><th>h(x)</th><td>${N(-225)}</td><td>${N(0)}</td><td>${N(15)}</td><td>${N(18.75)}</td><td>${N(20)}</td><td>${N(18.75)}</td><td>${N(15)}</td><td>${N(-25)}</td></tr></table></div></div>
  <div class="q"><span class="lbl">d. Quelles interprétations sont correctes ? (plusieurs réponses)</span>
    <div class="mcq multi" data-good="0,1,3">
      <button type="button" aria-pressed="false" data-i="0">Au moment du tir (t = 0), le ballon est au sol.</button>
      <button type="button" aria-pressed="false" data-i="1">La hauteur maximale est 20 m, atteinte au bout de 2 s.</button>
      <button type="button" aria-pressed="false" data-i="2">Au bout de 5 s, le ballon est à 25 m sous terre.</button>
      <button type="button" aria-pressed="false" data-i="3">Les valeurs pour t = −5 et t = 5 n'ont pas de sens dans la situation.</button>
    </div></div>`,
  corr:`a. ${M("h(1) = −5 + 20 = 15")} m ; ${M("h(2) = −20 + 40 = 20")} m. b. ${M("h(4) = −80 + 80 = 0")} : le ballon touche le sol au bout de 4 s.<br>c. Par exemple ${M("h(1,5) = −5 × 2,25 + 30 = 18,75")} et ${M("h(−5) = −125 − 100 = −225")}.<br>d. Le ballon monte jusqu'à 20 m (à 2 s) puis redescend ; un temps négatif n'existe pas et après 4 s le ballon est au sol, donc ${M("h(−5)")} et ${M("h(5)")} n'ont pas de sens ici.` },
];

/* =========================================================
   Moteur
   ========================================================= */
const saved=store.get("revfonctions")||{status:{},state:{}};
function save(){ store.set("revfonctions",saved); }
let cur=0, api=null;
const nav=$("#exNav");
EX.forEach((e,i)=>{ const b=document.createElement("button"); b.type="button"; b.textContent=i+1; b.setAttribute("aria-label","Exercice "+(i+1)); b.onclick=()=>go(i); nav.appendChild(b); });
function paintNav(){
  [...nav.children].forEach((b,i)=>{ const s=saved.status[i]; b.classList.toggle("done",s==="done"); b.classList.toggle("part",s==="part"); i===cur?b.setAttribute("aria-current","step"):b.removeAttribute("aria-current"); });
  const done=Object.values(saved.status).filter(s=>s==="done").length;
  $("#prog").innerHTML=`<b>${done}</b> / ${EX.length} exercices réussis`;
}
function go(i){
  cur=Math.max(0,Math.min(EX.length-1,i)); const E=EX[cur], st=$("#stage");
  st.innerHTML=E.html+`<div class="actions"><button class="btn" id="chk">Vérifier</button><button class="btn ghost" id="sol">Voir la correction</button><button class="btn ghost" id="rst">Effacer mes réponses</button><span class="result" id="res" aria-live="polite"></span></div><div class="corr" id="corr" hidden><div class="t">Correction</div><div>${E.corr}</div></div>`;
  saved.state[cur]=saved.state[cur]||{}; const S=saved.state[cur];
  // QCM
  $$(".mcq",st).forEach((g,gi)=>{ g.dataset.gi=gi; $$("button",g).forEach(b=>b.onclick=()=>{
    if(g.classList.contains("multi")) b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")!=="true");
    else $$("button",g).forEach(c=>c.setAttribute("aria-pressed",c===b));
    g.classList.remove("ok","bad"); S.q=S.q||{}; S.q[gi]=$$("button",g).filter(c=>c.getAttribute("aria-pressed")==="true").map(c=>+c.dataset.i); save(); }); });
  // champs
  $$("input.num",st).forEach((inp,ii)=>{ inp.dataset.ii=ii; inp.addEventListener("input",()=>{ inp.classList.remove("ok","bad"); S.n=S.n||{}; S.n[ii]=inp.value; save(); });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") check(); }); });
  // restauration
  if(S.n) $$("input.num",st).forEach(inp=>{ const v=S.n[inp.dataset.ii]; if(v!=null) inp.value=v; });
  if(S.q) $$(".mcq",st).forEach(g=>{ const v=S.q[g.dataset.gi]; if(v) $$("button",g).forEach(b=>b.setAttribute("aria-pressed",v.includes(+b.dataset.i))); });
  api = E.mount ? E.mount(st,S) : null;
  $("#chk",st).onclick=check;
  $("#sol",st).onclick=()=>{ const c=$("#corr",st); c.hidden=!c.hidden; $("#sol",st).textContent=c.hidden?"Voir la correction":"Masquer la correction"; };
  $("#rst",st).onclick=()=>{ saved.state[cur]={}; delete saved.status[cur]; save(); paintNav(); go(cur); };
  $("#prev").disabled=cur===0; $("#next").disabled=cur===EX.length-1;
  if(location.hash!=="#exercice-"+(cur+1)) history.replaceState(null,"","#exercice-"+(cur+1));
  paintNav();
}
function check(){
  const st=$("#stage"); let ok=0, tot=0;
  $$("input.num",st).forEach(inp=>{ tot++; const a=inp.dataset.ans, tol=+inp.dataset.tol; let good=false;
    if(a.startsWith("set:")){ const want=a.slice(4).split(";").map(Number).sort((p,q)=>p-q);
      const got=inp.value.split(/;|\bet\b/).map(parseNum).filter(v=>!isNaN(v)).sort((p,q)=>p-q);
      good=got.length===want.length && got.every((v,i)=>Math.abs(v-want[i])<=tol); }
    else { const v=parseNum(inp.value); good=!isNaN(v) && Math.abs(v-Number(a))<=tol; }
    inp.classList.toggle("ok",good); inp.classList.toggle("bad",!good); if(good) ok++; });
  $$(".mcq",st).forEach(g=>{ tot++; const want=g.dataset.good.split(",").map(Number).sort().join(",");
    const got=$$("button",g).filter(b=>b.getAttribute("aria-pressed")==="true").map(b=>+b.dataset.i).sort().join(",");
    const good=got===want; g.classList.toggle("ok",good); g.classList.toggle("bad",!good); if(good) ok++; });
  if(api && api.check){ const [a,b]=api.check(); ok+=a; tot+=b; }
  const res=$("#res",st);
  if(ok===tot){ res.className="result ok"; res.textContent=`Bravo, tout est juste ! (${ok} / ${tot})`; saved.status[cur]="done"; }
  else { res.className="result part"; res.textContent=`${ok} / ${tot} réponses justes. Corrige les cases en rouge.`; if(saved.status[cur]!=="done") saved.status[cur]="part"; }
  save(); paintNav();
}
$("#prev").onclick=()=>go(cur-1); $("#next").onclick=()=>go(cur+1);
window.addEventListener("hashchange",()=>{ const m=location.hash.match(/^#exercice-(\d+)$/); if(m && +m[1]-1!==cur) go(+m[1]-1); });
const redraw=()=>{ if(api && api.redraw) api.redraw(); };
const mq=window.matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener && mq.addEventListener("change",redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
const m=location.hash.match(/^#exercice-(\d+)$/); go(m?+m[1]-1:0);
})();
</script>
