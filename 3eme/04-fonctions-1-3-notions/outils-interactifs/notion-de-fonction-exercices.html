<style>
/* Layout : même cahier (fiche de 35 exercices) à petits carreaux que « La machine à fonctions » ; un exercice à la fois,
   pastilles d'avancement en haut. Vert = antécédent, rouge = image, bleu = fonction. */
:root{
  --paper:#f7f9fc; --grid:#dfe7f2; --ink:#18202e; --muted:#5b6678; --card:#ffffff; --line:#c9d3e1;
  --ant:#1b8a3a; --ant-soft:#e3f4e7; --img:#cf2f2b; --img-soft:#fbe6e4; --fn:#1f4e9c; --fn-soft:#e6edf8;
  --warn:#b26a00; --warn-soft:#fff2dc; --focus:#f2a900; --on-fn:#ffffff; --blue-curve:#1f5fd6; --red-curve:#e0211b;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-math:"Crimson Pro", "Cambria Math", Georgia, serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121722; --grid:#1d2533; --ink:#e8edf5; --muted:#9aa6b8; --card:#1a2130; --line:#2f3a4d;
  --ant:#4cc372; --ant-soft:#173324; --img:#ff6b63; --img-soft:#3a1d1d; --fn:#7aa5ff; --fn-soft:#1b2a47;
  --warn:#ffb547; --warn-soft:#3a2a12; --focus:#ffc94d; --on-fn:#0d1526; --blue-curve:#6ea0ff; --red-curve:#ff6b63; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121722; --grid:#1d2533; --ink:#e8edf5; --muted:#9aa6b8; --card:#1a2130; --line:#2f3a4d;
  --ant:#4cc372; --ant-soft:#173324; --img:#ff6b63; --img-soft:#3a1d1d; --fn:#7aa5ff; --fn-soft:#1b2a47;
  --warn:#ffb547; --warn-soft:#3a2a12; --focus:#ffc94d; --on-fn:#0d1526; --blue-curve:#6ea0ff; --red-curve:#ff6b63; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font:17px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg,var(--grid) 1px, transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:1040px; margin:0 auto; padding-block:18px 28px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:14px}
header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:10px 20px}
h1{font:800 clamp(26px,4vw,38px)/1.05 var(--f-display); margin:0; letter-spacing:-.01em}
.sub{color:var(--muted); font-size:15px}
.prog{font:700 15px var(--f-body); color:var(--muted); font-variant-numeric:tabular-nums}
.prog b{color:var(--ant); font-size:20px}
nav.exs{display:flex; flex-wrap:wrap; gap:6px}
nav.exs button{font:700 15px var(--f-body); width:42px; height:42px; border-radius:50%; border:2px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; font-variant-numeric:tabular-nums}
nav.exs button.done{border-color:var(--ant); background:var(--ant-soft); color:var(--ant)}
nav.exs button.part{border-color:var(--warn); background:var(--warn-soft); color:var(--warn)}
nav.exs button[aria-current="step"]{outline:3px solid var(--fn); outline-offset:2px}
button:focus-visible, input:focus-visible, select:focus-visible{outline:3px solid var(--focus); outline-offset:2px}

.stage{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:22px clamp(16px,3vw,30px);
  display:flex; flex-direction:column; gap:16px; box-shadow:0 10px 30px -18px rgba(20,40,80,.35)}
.stage h2{font:800 clamp(22px,3vw,28px)/1.15 var(--f-display); margin:0}
.stage h2 small{display:block; font:700 13px var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
.stage p{margin:0}
.q{display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px dashed var(--line)}
.q > .lbl{font-weight:700}
.cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start}
@media (max-width:780px){ .cols{grid-template-columns:1fr} }
.panel{display:flex; flex-direction:column; gap:12px; min-width:0}
.m{font-family:var(--f-math); font-style:italic; font-size:1.17em}
.ant{color:var(--ant); font-weight:700}

.line{display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px}

input.num{font:600 17px var(--f-body); width:5.2em; padding:5px 8px; border:2px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); text-align:center; font-variant-numeric:tabular-nums}
input.num.wide{width:9em}
input.num.ok, .tbl input.num.ok{border-color:var(--ant); background:var(--ant-soft)}
input.num.bad{border-color:var(--img); background:var(--img-soft)}
.mcq{display:flex; flex-wrap:wrap; gap:6px}
.mcq button{font:600 16px var(--f-body); border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:9px; padding:6px 12px; cursor:pointer; text-align:left}
.mcq button .m{font-size:1.1em}
.mcq button[aria-pressed="true"]{border-color:var(--fn); background:var(--fn-soft)}
.mcq.ok button[aria-pressed="true"]{border-color:var(--ant); background:var(--ant-soft)}
.mcq.bad button[aria-pressed="true"]{border-color:var(--img); background:var(--img-soft)}
.mcq.vf button{min-width:64px; text-align:center}

.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse; font-variant-numeric:tabular-nums}
table.tbl th, table.tbl td{border:1.5px solid var(--line); padding:5px 7px; text-align:center; min-width:52px}
table.tbl th{font-family:var(--f-math); font-style:italic; font-size:18px; background:var(--ant-soft); color:var(--ant); white-space:nowrap}
table.tbl tr.ri th{background:var(--img-soft); color:var(--img)}
table.tbl tr.ri2 th{background:var(--fn-soft); color:var(--fn)}
table.tbl input.num{width:4.2em; padding:4px; font-size:16px}

.actions{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding-top:6px}
.btn{font:700 16px var(--f-body); border:0; border-radius:10px; padding:10px 18px; cursor:pointer; background:var(--fn); color:var(--on-fn)}
.btn.ghost{background:transparent; color:var(--fn); border:1.5px solid var(--fn)}
.btn:disabled{opacity:.45; cursor:default}
.result{font-weight:700}
.result.ok{color:var(--ant)} .result.part{color:var(--warn)}
.corr{border:1.5px solid var(--fn); background:var(--fn-soft); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:6px}
.corr .t{font:800 13px var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--fn)}
.hint{color:var(--muted); font-size:14px}
svg{display:block; width:100%; height:auto; max-width:100%}
svg text{font-family:var(--f-body)}
svg.clickable{cursor:crosshair; touch-action:manipulation}
#stage > svg, .q > svg{max-width:640px; margin-inline:auto}
.cols > svg{max-width:280px; margin-inline:auto}
.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.chips button{font:700 16px var(--f-body); min-width:44px; border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:9px; padding:5px 10px; cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--fn); background:var(--fn-soft); color:var(--fn)}
.chips button.ok{border-color:var(--ant); color:var(--ant)}
.chips button.bad{border-color:var(--img); color:var(--img)}
footer.nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS="http://www.w3.org/2000/svg";
const sv=(t,a={})=>{const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e;};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fmt(v,d=2){ if(Math.abs(v)<1e-9) v=0; return (Math.round(v*10**d)/10**d).toString().replace(".",",").replace("-","−"); }
function parseNum(s){
  if(s==null) return NaN; s=String(s).trim().replace(/\s/g,"").replace(/[−–]/g,"-").replace(",",".");
  if(s==="") return NaN;
  if(/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)){ const [a,b]=s.split("/").map(Number); return b? a/b : NaN; }
  return /^-?\d*\.?\d+$/.test(s)? Number(s) : NaN;
}
const store={ get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

/* ---------- constructeurs ---------- */
// ans : nombre | "set:a;b" (liste sans ordre) | "out:a:b" (hors de [a ; b]) | "in:a:b" (dans [a ; b])
const N=(ans,tol=0.001,cls="")=>`<input class="num ${cls}" inputmode="decimal" autocomplete="off" data-ans="${ans}" data-tol="${tol}" aria-label="réponse">`;
const S=(ans,tol=0.001)=>N("set:"+ans,tol,"wide")+`<span class="hint">sépare par « ; »</span>`;
const Q=(opts,good,cls="")=>`<div class="mcq ${cls}" data-good="${good}" role="group">${opts.map((o,i)=>`<button type="button" aria-pressed="false" data-i="${i}">${o}</button>`).join("")}</div>`;
const M=s=>`<span class="m">${s}</span>`;
const L=(label,field)=>`<div class="line"><span class="lbl">${label}</span>${field}</div>`;
const E=(...parts)=>`<span class="eq">${parts.join(" ")}</span>`;
const q=(...rows)=>`<div class="q">${rows.join("")}</div>`;
const T=(rows)=>`<div class="tblwrap"><table class="tbl">${rows.map((r,i)=>`<tr class="${i===1?"ri":i===2?"ri2":""}"><th>${r[0]}</th>${r.slice(1).map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const H=(n,title)=>`<h2><small>Exercice n°${n}</small>${title}</h2>`;
const GR=id=>`<svg id="${id}" role="img" aria-label="Graphique de l'exercice"></svg>`;

/* ---------- repère ---------- */
function axes(svg,o){
  const {W,H,pad}=o; svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML="";
  const X=x=>pad.l+(x-o.xmin)/(o.xmax-o.xmin)*(W-pad.l-pad.r), Y=y=>H-pad.b-(y-o.ymin)/(o.ymax-o.ymin)*(H-pad.t-pad.b);
  const Xi=px=>o.xmin+(px-pad.l)/(W-pad.l-pad.r)*(o.xmax-o.xmin), Yi=py=>o.ymin+(H-pad.b-py)/(H-pad.t-pad.b)*(o.ymax-o.ymin);
  const line=css("--line"), ink=css("--ink"), mut=css("--muted"), g=sv("g");
  const fine=o.fx&&o.fy;
  if(fine){ for(let x=Math.ceil(o.xmin/o.fx)*o.fx;x<=o.xmax+1e-9;x+=o.fx) g.appendChild(sv("line",{x1:X(x),y1:Y(o.ymin),x2:X(x),y2:Y(o.ymax),stroke:line,"stroke-width":.4,opacity:.7}));
    for(let y=Math.ceil(o.ymin/o.fy)*o.fy;y<=o.ymax+1e-9;y+=o.fy) g.appendChild(sv("line",{x1:X(o.xmin),y1:Y(y),x2:X(o.xmax),y2:Y(y),stroke:line,"stroke-width":.4,opacity:.7})); }
  for(let x=Math.ceil(o.xmin/o.xs)*o.xs;x<=o.xmax+1e-9;x+=o.xs) g.appendChild(sv("line",{x1:X(x),y1:Y(o.ymin),x2:X(x),y2:Y(o.ymax),stroke:line,"stroke-width":.9}));
  for(let y=Math.ceil(o.ymin/o.ys)*o.ys;y<=o.ymax+1e-9;y+=o.ys) g.appendChild(sv("line",{x1:X(o.xmin),y1:Y(y),x2:X(o.xmax),y2:Y(y),stroke:line,"stroke-width":.9}));
  const x0=Math.max(o.xmin,Math.min(o.xmax,0)), y0=Math.max(o.ymin,Math.min(o.ymax,0));
  g.appendChild(sv("line",{x1:X(o.xmin),y1:Y(y0),x2:X(o.xmax),y2:Y(y0),stroke:ink,"stroke-width":1.8}));
  g.appendChild(sv("line",{x1:X(x0),y1:Y(o.ymin),x2:X(x0),y2:Y(o.ymax),stroke:ink,"stroke-width":1.8}));
  g.appendChild(sv("path",{d:`M${X(o.xmax)} ${Y(y0)} l-9 -5 v10 z`,fill:ink})); g.appendChild(sv("path",{d:`M${X(x0)} ${Y(o.ymax)} l-5 9 h10 z`,fill:ink}));
  const lx=o.lx||o.xs, ly=o.ly||o.ys;
  for(let x=Math.ceil(o.xmin/lx)*lx;x<=o.xmax+1e-9;x+=lx){ if(Math.abs(x)<1e-9&&!o.zero) continue; const t=sv("text",{x:X(x),y:Y(y0)+16,"text-anchor":"middle","font-size":12.5,fill:mut}); t.textContent=fmt(x); g.appendChild(t); }
  for(let y=Math.ceil(o.ymin/ly)*ly;y<=o.ymax+1e-9;y+=ly){ if(Math.abs(y)<1e-9&&!o.zero) continue; const t=sv("text",{x:X(x0)-6,y:Y(y)+4,"text-anchor":"end","font-size":12.5,fill:mut}); t.textContent=fmt(y); g.appendChild(t); }
  if(o.xlab){ const t=sv("text",{x:X(o.xmax)-2,y:Y(y0)-8,"text-anchor":"end","font-size":13,"font-weight":700,fill:ink}); t.textContent=o.xlab; g.appendChild(t); }
  if(o.ylab){ const t=sv("text",{x:X(x0)+8,y:Y(o.ymax)+13,"font-size":13,"font-weight":700,fill:ink}); t.textContent=o.ylab; g.appendChild(t); }
  svg.appendChild(g); return {X,Y,Xi,Yi};
}
function svgPoint(svg,evt){ const p=svg.createSVGPoint(); p.x=evt.clientX; p.y=evt.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function smooth(pts,X,Y){ let d=`M${X(pts[0][0])} ${Y(pts[0][1])}`;
  for(let i=0;i<pts.length-1;i++){ const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=` C${X(c1[0])} ${Y(c1[1])} ${X(c2[0])} ${Y(c2[1])} ${X(p2[0])} ${Y(p2[1])}`; } return d; }
function fpath(f,a,b,X,Y,ymin,ymax,n=300){ let d="",pen=false; for(let i=0;i<=n;i++){ const x=a+(b-a)*i/n, y=f(x); if(!isFinite(y)||y<ymin||y>ymax){pen=false;continue;} d+=(pen?"L":"M")+X(x).toFixed(1)+" "+Y(y).toFixed(1)+" "; pen=true; } return d; }
const poly=(pts,X,Y)=>"M"+pts.map(([x,y])=>X(x)+" "+Y(y)).join(" L");
// graphique statique : curves = [{d:(X,Y)=>path, color, label:[x,y,texte]}], marks = [[x,y]]
function staticGraph(id,cfg,curves,marks=[]){
  return { mount(st){ const svg=$("#"+id,st);
    function draw(){ const {X,Y}=axes(svg,cfg);
      curves.forEach(c=>{ svg.appendChild(sv("path",{d:c.d(X,Y),fill:"none",stroke:css(c.color||"--fn"),"stroke-width":3}));
        if(c.label){ const t=sv("text",{x:X(c.label[0]),y:Y(c.label[1]),"font-size":15,"font-weight":700,"font-style":"italic",fill:css(c.color||"--fn")}); t.textContent=c.label[2]; svg.appendChild(t);} });
      marks.forEach(([x,y])=>{ svg.appendChild(sv("path",{d:`M${X(x)-5} ${Y(y)} h10 M${X(x)} ${Y(y)-5} v10`,stroke:css("--img"),"stroke-width":2})); });
    } draw(); return {redraw:draw}; } };
}
// widget « placer des points »
function placeGraph(id,cfg,expected,snap,tol,curveAfter){
  return { mount(st,S){ const svg=$("#"+id,st); svg.classList.add("clickable"); S.pts=S.pts||[]; let A;
    function draw(){ A=axes(svg,cfg); const {X,Y}=A, img=css("--img"), fn=css("--fn");
      const pts=[...S.pts].sort((a,b)=>a[0]-b[0]);
      if(S.showCurve && curveAfter) svg.appendChild(sv("path",{d:curveAfter(X,Y),fill:"none",stroke:fn,"stroke-width":2.5}));
      pts.forEach(([x,y])=>svg.appendChild(sv("circle",{cx:X(x),cy:Y(y),r:6,fill:img})));
      const n=$("#"+id+"n",st); if(n) n.textContent=`${S.pts.length} / ${expected.length} points placés.`; }
    svg.addEventListener("click",e=>{ const p=svgPoint(svg,e); const x=Math.round(A.Xi(p.x)/snap[0])*snap[0], y=Math.round(A.Yi(p.y)/snap[1])*snap[1];
      if(x<cfg.xmin||x>cfg.xmax||y<cfg.ymin||y>cfg.ymax) return;
      const k=S.pts.findIndex(q=>Math.hypot((q[0]-x)/snap[0],(q[1]-y)/snap[1])<0.6);
      if(k>=0) S.pts.splice(k,1); else S.pts.push([+x.toFixed(3),+y.toFixed(3)]);
      S.showCurve=false; draw(); save(); });
    draw();
    return { redraw:draw, check(){ let ok=0; expected.forEach(([x,y])=>{ if(S.pts.some(q=>Math.abs(q[0]-x)<=tol[0]&&Math.abs(q[1]-y)<=tol[1])) ok++; });
      const extra=S.pts.filter(q=>!expected.some(([x,y])=>Math.abs(q[0]-x)<=tol[0]&&Math.abs(q[1]-y)<=tol[1])).length;
      const sc=Math.max(0,ok-extra); if(sc===expected.length){ S.showCurve=true; draw(); } return [sc,expected.length]; } }; } };
}

/* ---------- données des graphiques ---------- */
const V4=[[0,50],[5,52],[10,55],[15,58],[20,60],[23,63],[25,61],[30,40],[35,20],[40,30],[45,45],[50,50],[55,62],[60,65]];
const P5=[[0,0],[1,2],[2,3.8],[3,5.5],[4,7],[5,8.3],[6,9.5],[7,10.5],[8,11.5],[9,12.5],[10,13.5]];
const H11=[[0,1],[2,1.2],[4,2],[5,3.2],[6,4.5],[7,4.9],[8,5],[10,5.5],[11,5.6],[12,5.55],[14,5.1],[15,4.1],[16,3],[17,2],[18,1.4],[19,1.3],[22,1.2],[24,1]];
const P28=[[-3,4],[-2,2],[-1,1],[0,2],[1,3],[2,2],[3,0],[4,-2],[5,-3],[6,-2],[7,0],[8,2],[9,5]];
const P30=[[-3,-1],[-1,-1],[0,1],[3,2],[4,1],[5,0],[6,1]];
const P31=[[-3,1],[-2,2],[-1,1.5],[0,0],[1,-1],[2.5,-0.6],[4,0]];
const h32=x=> x<=-1 ? 1+4*(x+1.5) : x<=0 ? 3 : x<=1 ? 4*(x-1)**2-1 : 12*(x-1)**2-1;
const g20a=90/56, g20b=90/56-10, g20=x=>g20a*x*x+g20b*x, f20=x=>1.25*x+11.25;

const SAISON=["l'hiver","le printemps","l'été","l'automne"];
/* =========================================================
   Les 35 exercices
   ========================================================= */
const EX=[
{ html:H(1,`${M("f : x ⟼ (x − 3)²")}`)+
  q(L("1) Images de 2 et de 5 :",E("f(2) =",N(1))+E("f(5) =",N(4))))+

/* =========================================================
   Moteur
   ========================================================= */
const KEY="fiche35fonctions";
const saved=store.get(KEY)||{status:{},state:{}};
function save(){ store.set(KEY,saved); }
let cur=0, api=null;
const nav=$("#exNav");
EX.forEach((e,i)=>{ const b=document.createElement("button"); b.type="button"; b.textContent=i+1; b.setAttribute("aria-label","Exercice "+(i+1)); b.onclick=()=>go(i); nav.appendChild(b); });
function paintNav(){
  [...nav.children].forEach((b,i)=>{ const s=saved.status[i]; b.classList.toggle("done",s==="done"); b.classList.toggle("part",s==="part"); i===cur?b.setAttribute("aria-current","step"):b.removeAttribute("aria-current"); });
  const done=Object.values(saved.status).filter(s=>s==="done").length;
  $("#prog").innerHTML=`<b>${done}</b> / ${EX.length} exercices réussis`;
}
function go(i){
  cur=Math.max(0,Math.min(EX.length-1,i)); const Ex=EX[cur], st=$("#stage");
  st.innerHTML=Ex.html+`<div class="actions"><button class="btn" id="chk">Vérifier</button><button class="btn ghost" id="sol">Voir la correction</button><button class="btn ghost" id="rst">Effacer mes réponses</button><span class="result" id="res" aria-live="polite"></span></div><div class="corr" id="corr" hidden><div class="t">Correction</div><div>${Ex.corr}</div></div>`;
  saved.state[cur]=saved.state[cur]||{}; const St=saved.state[cur];
  $$(".mcq",st).forEach((g,gi)=>{ g.dataset.gi=gi; $$("button",g).forEach(b=>b.onclick=()=>{
    if(g.classList.contains("multi")) b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")!=="true");
    else $$("button",g).forEach(c=>c.setAttribute("aria-pressed",c===b));
    g.classList.remove("ok","bad"); St.q=St.q||{}; St.q[gi]=$$("button",g).filter(c=>c.getAttribute("aria-pressed")==="true").map(c=>+c.dataset.i); save(); }); });
  $$("input.num",st).forEach((inp,ii)=>{ inp.dataset.ii=ii; inp.addEventListener("input",()=>{ inp.classList.remove("ok","bad"); St.n=St.n||{}; St.n[ii]=inp.value; save(); });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") check(); }); });
  if(St.n) $$("input.num",st).forEach(inp=>{ const v=St.n[inp.dataset.ii]; if(v!=null) inp.value=v; });
  if(St.q) $$(".mcq",st).forEach(g=>{ const v=St.q[g.dataset.gi]; if(v) $$("button",g).forEach(b=>b.setAttribute("aria-pressed",v.includes(+b.dataset.i))); });
  api = Ex.mount ? Ex.mount(st,St) : null;
  $("#chk",st).onclick=check;
  $("#sol",st).onclick=()=>{ const c=$("#corr",st); c.hidden=!c.hidden; $("#sol",st).textContent=c.hidden?"Voir la correction":"Masquer la correction"; };
  $("#rst",st).onclick=()=>{ saved.state[cur]={}; delete saved.status[cur]; save(); paintNav(); go(cur); };
  $("#prev").disabled=cur===0; $("#next").disabled=cur===EX.length-1;
  if(location.hash!=="#exercice-"+(cur+1)) history.replaceState(null,"","#exercice-"+(cur+1));
  paintNav();
}
function judge(inp){
  const a=inp.dataset.ans, tol=+inp.dataset.tol;
  if(a.startsWith("set:")){ const want=a.slice(4).split(";").map(Number).sort((p,q)=>p-q);
    const got=inp.value.split(/;|\bet\b|\bou\b/).map(parseNum).filter(v=>!isNaN(v)).sort((p,q)=>p-q);
    return got.length===want.length && got.every((v,i)=>Math.abs(v-want[i])<=tol); }
  const v=parseNum(inp.value); if(isNaN(v)) return false;
  if(a.startsWith("out:")){ const [lo,hi]=a.slice(4).split(":").map(Number); return v<lo-1e-9 || v>hi+1e-9; }
  if(a.startsWith("in:")){ const [lo,hi]=a.slice(3).split(":").map(Number); return v>=lo-1e-9 && v<=hi+1e-9; }
  return Math.abs(v-Number(a))<=tol;
}
function check(){
  const st=$("#stage"); let ok=0, tot=0;
  $$("input.num",st).forEach(inp=>{ tot++; const good=judge(inp); inp.classList.toggle("ok",good); inp.classList.toggle("bad",!good); if(good) ok++; });
  $$(".mcq",st).forEach(g=>{ tot++; const want=g.dataset.good.split(",").map(Number).sort().join(",");
    const got=$$("button",g).filter(b=>b.getAttribute("aria-pressed")==="true").map(b=>+b.dataset.i).sort().join(",");
    const good=got===want; g.classList.toggle("ok",good); g.classList.toggle("bad",!good); if(good) ok++; });
  if(api && api.check){ const [a,b]=api.check(); ok+=a; tot+=b; }
  const res=$("#res",st);
  if(ok===tot){ res.className="result ok"; res.textContent=`Bravo, tout est juste ! (${ok} / ${tot})`; saved.status[cur]="done"; }
  else { res.className="result part"; res.textContent=`${ok} / ${tot} réponses justes. Corrige ce qui est en rouge.`; if(saved.status[cur]!=="done") saved.status[cur]="part"; }
  save(); paintNav();
}
$("#prev").onclick=()=>go(cur-1); $("#next").onclick=()=>go(cur+1);
window.addEventListener("hashchange",()=>{ const m=location.hash.match(/^#exercice-(\d+)$/); if(m && +m[1]-1!==cur) go(+m[1]-1); });
const redraw=()=>{ if(api && api.redraw) api.redraw(); };
const mq=window.matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener && mq.addEventListener("change",redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
const m=location.hash.match(/^#exercice-(\d+)$/); go(m?+m[1]-1:0);
})();
</script>
