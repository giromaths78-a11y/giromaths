<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animation tableur : les noms de cellules</title>
<style>
:root{--niv:#c026d3;--nivc:#fbe6fd;--a:#2563eb;--b:#ea580c;--ink:#1b1b1f}
*{box-sizing:border-box}body{margin:0;font-family:'Fira Sans','Inter',system-ui,sans-serif;color:var(--ink);background:#fff}
.wrap{max-width:860px;margin:0 auto;padding:14px}
.ban{background:var(--niv);color:#fff;border-radius:10px;padding:10px 16px}.ban small{display:block}.ban h1{margin:0;font-size:1.5rem}
.cap{margin:12px 0;padding:10px 14px;background:var(--nivc);border:2px solid var(--niv);border-radius:10px;min-height:4.4em;font-size:1.05rem}
.cap.bad{background:#fff5f5;border-color:#dc2626}.cap b{color:var(--niv)}.cap.bad b{color:#dc2626}
.bar{display:flex;align-items:center;gap:8px;border:2px solid #888;border-radius:8px;padding:6px 10px;font-family:'Liberation Mono',monospace;font-size:1.1rem;min-height:2.4em}
.bar i{font-style:normal;font-family:sans-serif;font-weight:700;color:#666;border-right:2px solid #ccc;padding-right:8px}
.ra{color:var(--a);font-weight:700}.rb{color:var(--b);font-weight:700}
table{border-collapse:collapse;margin:10px 0;width:100%;table-layout:fixed;font-size:1.15rem}
th,td{border:1px solid #999;height:2.5em;text-align:center;position:relative;transition:background .3s}
th{background:#eee;font-weight:600}.rh{background:#eee;width:2.6em;font-weight:600}
td.oa{outline:3px solid var(--a);outline-offset:-3px;background:#e8f0ff}td.ob{outline:3px solid var(--b);outline-offset:-3px;background:#fff0e6}
td.sel{outline:3px solid #111;outline-offset:-3px}td.ok{background:#e8f6e6}td.ko{background:#fee2e2}
td .f{display:block;font-size:.72rem;color:#666;font-family:'Liberation Mono',monospace}
td input{width:100%;height:100%;border:0;background:transparent;text-align:center;font:inherit}
td.pulse{animation:p .8s}@keyframes p{0%{background:#fde68a}100%{}}
td.hdl::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;background:#111;border:1px solid #fff}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:2px solid var(--niv);background:#fff;color:var(--niv);border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:600}
button.p{background:var(--niv);color:#fff}button:disabled{opacity:.4;cursor:default}
.dots{margin-left:auto;color:#888}label{margin-left:8px;font-size:.95rem}
</style></head><body><div class="wrap">
<div class="ban"><small>3<sup>e</sup> – Tableur</small><h1>Les noms de cellules dans les formules</h1></div>
<div class="cap" id="cap"></div>
<div class="bar"><i>fx</i><span id="bar"></span></div>
<table id="grid"></table>
<div class="ctl"><button id="prev">◀ Précédent</button><button id="next" class="p">Suivant ▶</button><button id="auto">▶ Lecture auto</button><button id="redo">↺ Recommencer</button>
<label><input type="checkbox" id="showf"> Afficher les formules dans les cases</label><span class="dots" id="dots"></span></div>
</div>
<script>
const $=id=>document.getElementById(id), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const N=5, A0=[2,5,8,3,10], B0=[4,1,6,7,2];
let S, run=0, step=0, autoplay=false;
const reset=()=>{S={A:[...A0],B:[...B0],C:Array(N).fill(null),mode:'ref',sel:null,hiA:null,hiB:null,bar:'',live:false,cls:{}}};
const fx=i=>S.C[i]==null?'':S.mode==='const'?`=${A0[0]}+${B0[0]}`:`=A${i+1}+B${i+1}`;
const val=i=>S.C[i]==null?'':S.mode==='const'?S.A[0]+S.B[0]:S.A[i]+S.B[i];
function barHtml(f,i){ // colore les noms de cellules
  return f.replace(/([AB])(\d)/g,(m,c)=>`<span class="r${c.toLowerCase()}">${m}</span>`);}
function draw(){
  let h='<tr><th class="rh"></th><th>A</th><th>B</th><th>C</th></tr>';
  for(let i=0;i<N;i++){
    const c=(k,cl)=>`class="${cl}"`;
    const oa=S.hiA===i?' oa':'', ob=S.hiB===i?' ob':'';
    const sel=S.sel===i?' sel':'', hd=(S.sel===i&&S.C[i]!=null&&S.hdl)?' hdl':'', st=S.cls[i]||'';
    const inp=S.live?(k=>`<input type="number" data-k="${k}" data-i="${i}" value="${S[k][i]}">`):(k=>S[k][i]);
    const ff=$('showf').checked&&S.C[i]!=null?`<span class="f">${fx(i)}</span>`:'';
    h+=`<tr><th class="rh">${i+1}</th><td id="a${i}" class="${oa}">${inp('A')}</td><td id="b${i}" class="${ob}">${inp('B')}</td><td id="c${i}" data-i="${i}" class="${sel} ${hd} ${st}">${val(i)}${ff}</td></tr>`;
  }
  $('grid').innerHTML=h; $('bar').innerHTML=barHtml(S.bar);
  document.querySelectorAll('td[data-i]').forEach(td=>td.onclick=()=>{const i=+td.dataset.i;if(S.C[i]!=null){S.sel=i;S.bar=fx(i);S.hiA=S.hiB=i;draw();}});
  document.querySelectorAll('td input').forEach(inp=>inp.oninput=()=>{S[inp.dataset.k][+inp.dataset.i]=+inp.value||0;const f=document.activeElement;
    for(let i=0;i<N;i++){const td=$('c'+i),fl=td.querySelector('.f');td.firstChild.textContent=val(i);}});
}
function cap(t,bad){$('cap').innerHTML=t;$('cap').className='cap'+(bad?' bad':'');}
async function type(f,tok){for(let k=1;k<=f.length;k++){S.bar=f.slice(0,k);if(tok()){return false;}draw();await sleep(260);}return true;}
const STEPS=[
 async tok=>{reset();cap("Voici un petit tableau : deux colonnes de nombres, <b>A</b> et <b>B</b>. On veut additionner, sur chaque ligne, le nombre de A et le nombre de B.");draw();},
 async tok=>{reset();draw();S.sel=0;S.hdl=false;cap("<b>Principe 1</b> : une formule commence <b>toujours</b> par le symbole <b>=</b>.");draw();
   if(!await type('=A1+B1',tok))return; S.C[0]=1;S.hiA=0;S.hiB=0;S.hdl=true;draw();
   cap("<b>A1</b> et <b>B1</b> sont des <b>noms de cellules</b> : la lettre de la colonne, puis le numéro de la ligne. Dans la formule, <span class='ra'>A1</span> est en bleu et <span class='rb'>B1</span> en orange, comme leurs cases.");},
 async tok=>{if(S.C[0]==null){S.sel=0;S.C[0]=1;S.hiA=S.hiB=0;S.hdl=true;S.bar='=A1+B1';}
   cap("<b>Principe 3</b> : on écrit le <b>nom</b> de la cellule, pas sa valeur. Changeons la valeur de <span class='ra'>A1</span> : 2 devient 10…");draw();await sleep(1500);if(tok())return;
   S.A[0]=10;S.cls[0]='pulse';draw();$('a0').classList.add('pulse');await sleep(300);
   cap("Le résultat de C1 s'est <b>mis à jour tout seul</b> : 10 + 4 = 14. La formule lit les cellules, elle ne contient pas les nombres.");},
 async tok=>{if(S.C[0]==null){S.sel=0;S.C[0]=1;S.A[0]=10;S.hdl=true;}
   S.sel=0;S.hiA=S.hiB=0;S.bar='=A1+B1';cap("Pour recopier la formule vers le bas, on <b>étire la poignée</b> (le petit carré noir en bas à droite de la cellule).");draw();await sleep(1700);if(tok())return;
   for(let i=1;i<N;i++){S.C[i]=1;S.sel=i;S.hiA=S.hiB=i;S.bar=fx(i);S.hdl=true;draw();
     cap(`Ligne ${i+1} : la formule devient <b>${fx(i)}</b>. Les noms de cellules <b>se décalent</b> d'une ligne à chaque fois.`);await sleep(1400);if(tok())return;}
   S.hiA=S.hiB=null;draw();cap("Une seule formule écrite, cinq résultats corrects. <b>C'est pour cela</b> qu'on utilise les noms de cellules.");},
 async tok=>{reset();S.A[0]=10;S.mode='const';S.C[0]=1;S.sel=0;S.hdl=true;S.bar='=10+4';
   cap("<b>Piège ✗</b> : on écrit les <b>valeurs</b> (10 et 4) au lieu des noms de cellules : <b>=10+4</b>. Étirons la formule…",true);draw();await sleep(2000);if(tok())return;
   for(let i=1;i<N;i++){S.C[i]=1;S.sel=i;S.bar='=10+4';S.cls[i]='ko';draw();await sleep(700);if(tok())return;}
   cap("✗ Partout <b>14</b> ! La formule recopie les mêmes nombres : les nombres des autres lignes sont ignorés. Il fallait écrire <b>=A2+B2</b>, etc.",true);},
 async tok=>{reset();S.live=true;S.sel=null;for(let i=0;i<N;i++)S.C[i]=1;S.bar='';S.hdl=false;
   cap("<b>À toi !</b> Modifie les nombres des colonnes A et B : la colonne C se recalcule. Coche « Afficher les formules » pour voir les noms de cellules de chaque ligne.");draw();}
];
function go(n){step=Math.max(0,Math.min(STEPS.length-1,n));run++;const my=run;
  STEPS[step](()=>my!==run).then(()=>{if(autoplay&&my===run){if(step<STEPS.length-1){sleep(2600).then(()=>{if(my===run)go(step+1);});}else{autoplay=false;$('auto').textContent='▶ Lecture auto';}}});
  $('prev').disabled=step===0;$('next').disabled=step===STEPS.length-1;$('dots').textContent=`Étape ${step+1} / ${STEPS.length}`;}
$('prev').onclick=()=>{autoplay=false;go(step-1)};$('next').onclick=()=>{autoplay=false;go(step+1)};
$('auto').onclick=()=>{autoplay=!autoplay;$('auto').textContent=autoplay?'⏸ Pause':'▶ Lecture auto';if(autoplay)go(step);};
$('redo').onclick=()=>{autoplay=false;$('auto').textContent='▶ Lecture auto';go(0)};
$('showf').onchange=()=>draw();
document.onkeydown=e=>{if(e.key==='ArrowRight'&&e.target.tagName!=='INPUT')$('next').click();if(e.key==='ArrowLeft'&&e.target.tagName!=='INPUT')$('prev').click();};
reset();go(0);
</script></body></html>
